    line_romanized: "Igeoseun jom neomu simhada."
    tags: ["裏切り", "薬物", "衝撃", "短文化"]
    z_intensity: "high"
    z_mode: "numb"
  - situation: "薬物への疑念が連想の暴走へ変わる。"
