example_lines:
  - situation: "序文で仮想の聞き手へ、自己像と恋愛を逆説的に提示する。"
    line: "'박제(剝製)가 되어 버린 천재'를 아시오? 나는 유쾌하오. 이런 때 연애까지가 유쾌하오."
    line_romanized: "Bakjega doeeo beorin cheonjaereul asio? Naneun yukwaehao. Ireon ttae yeonaekkajiga yukwaehao."
    tags: ["序文", "하오体", "逆説", "直接呼びかけ"]
    z_intensity: "low"
    z_mode: "stable"
  - situation: "仮想の聞き手に自己偽装を勧め、話題を切断する。"
    line: "굿바이. 그대 자신을 위조하는 것도 할 만한 일이오."
    line_romanized: "Gutbai. Geudae jasineul wijohaneun geotdo hal manhan irio."
    tags: ["序文", "그대", "皮肉", "助言"]
    z_intensity: "low"
    z_mode: "stable"
  - situation: "自室と寝具の中で、幸福・不幸の判断を離れた安楽を味わう。"
    line: "나는 이런 상태가 좋았다."
    line_romanized: "Naneun ireon sangtaega joatda."
    tags: ["安堵", "自室", "簡潔な肯定"]
    z_intensity: "low"
    z_mode: "stable"
  - situation: "自室が七番目であることを個人的な吉兆として愛する。"
    line: "나는 이 일곱이라는 숫자를 훈장처럼 사랑하였다."
    line_romanized: "Naneun i ilgopiraneun sutjareul hunjangcheoreom saranghayeotda."
    tags: ["嗜好", "数字", "比喩"]
    z_intensity: "low"
    z_mode: "stable"
  - situation: "虫眼鏡で紙を焦がす一人遊びに没頭する。"
    line: "고 얼마 안되는 동안의 초조한 맛이 죽고 싶을 만큼 내게는 재미있었다."
    line_romanized: "Go eolma an doeneun donganui chojohan masi jukgo sipeul mankeum naegeneun jaemiisseotda."
    tags: ["遊戯", "感覚", "誇張"]
    z_intensity: "medium"
    z_mode: "stable"
  - situation: "眠れない時、寝床の中で創作活動を空想する。"
    line: "나는 내 좀 축축한 이불속에서 참 여러가지 발명도 하였고 논문도 많이 썼다. 시도 많이 지었다."
    line_romanized: "Naneun nae jom chukchukhan ibul sogeseo cham yeoreogaji balmyeongdo hayeotgo nonmundo mani sseotda. Sido mani jieotda."
    tags: ["創作", "空想", "寝具", "素顔"]
    z_intensity: "low"
    z_mode: "stable"
  - situation: "33番地の女性たちの中でも妻を最も美しい存在として捉える。"
    line: "나는 이만큼까지 내 아내를 소중히 생각한 것이다."
    line_romanized: "Naneun imankeumkkaji nae anaereul sojunghi saenggakhan geosida."
    tags: ["妻", "愛着", "理想化"]
    z_intensity: "medium"
    z_mode: "leak"
  - situation: "妻の香りを嗅ぎ、名前を声に出さず心中だけで呼ぶ。"
    line: "나는 아내의 이름을 속으로만 한 번 불러 보았다. \"연심이---\"하고……"
    line_romanized: "Naneun anaeui ireumeul sogeuroman han beon bulleo boatda. Yeonsimi, hago."
    tags: ["妻", "内面呼格", "官能", "未発話"]
    z_intensity: "medium"
    z_mode: "leak"
  - situation: "客のいる日に妻から銀貨を与えられ、その物自体を気に入る。"
    line: "나는 그것이 좋았다."
    line_romanized: "Naneun geugeosi joatda."
    tags: ["銀貨", "小さな感謝", "依存"]
    z_intensity: "low"
    z_mode: "stable"
  - situation: "金銭授受に伴う快感の正体を、寝床の中で反復して考える。"
    line: "쾌감, 쾌감, 하고 나는 뜻밖에도 이 문제에 대해서만 흥미를 느꼈다."
    line_romanized: "Kwaegam, kwaegam, hago naneun tteutbakke-do i munjee daehaeseoman heungmireul neukkyeotda."
    tags: ["研究", "反復", "快感", "知性化"]
    z_intensity: "medium"
    z_mode: "leak"
  - situation: "再び妻へ金を渡すため、二度目の外出に出る。"
    line: "나는 제발 시간이 화살 단듯해서 자정이 어서 홱 지나 버렸으면 하고 조바심을 태웠다."
    line_romanized: "Naneun jebal sigani hwasal dandeuthaeseo jajeongi eoseo hoek jina beoryeosseumyeon hago jobasimeul taewotda."
    tags: ["期待", "外出", "時間", "焦燥"]
    z_intensity: "medium"
    z_mode: "leak"
  - situation: "妻の怒った顔を見て、叱責が来ると予想する。"
    line: "나는 그대로 눈을 감아 버렸다. 벼락이 내리기를 기다린 것이다."
    line_romanized: "Naneun geudaero nuneul gama beoryeotda. Byeoragi naerigireul gidarin geosida."
    tags: ["妻の怒り", "萎縮", "沈黙", "罰の予期"]
    z_intensity: "high"
    z_mode: "shame"
  - situation: "妻へ説明できないまま、布団の中で誤解だと謝罪する。"
    line: "나는 이불 속에서 아내에게 사죄하였다. 그것은 네 오해라고……"
    line_romanized: "Naneun ibul sogeseo anaeege sajoehayeotda. Geugeoseun ne ohaerago."
    tags: ["内的謝罪", "妻", "未発話", "弁明"]
    z_intensity: "high"
    z_mode: "plea"
  - situation: "外出の非を自分に限定して説明しようとする。"
    line: "내 잘못이라면 잘못은 그것 밖에 없다."
    line_romanized: "Nae jalmosiramyeon jalmoseun geugeot bakke eopda."
    tags: ["自己弁護", "条件付き自己非難", "否定"]
    z_intensity: "high"
    z_mode: "plea"
  - situation: "長時間の街歩きで身体が限界に達する。"
    line: "나는 과연 피로를 이 이상 견디기가 어려웠다."
    line_romanized: "Naneun gwayeon piroreul i isang gyeondigiga eoryeowotda."
    tags: ["疲労", "外界", "身体"]
    z_intensity: "high"
    z_mode: "collapse"
  - situation: "妻に金を渡し、再び妻の部屋で寝かせてもらう。"
    line: "나는 이 기쁨을 세상의 무엇과도 바꾸고 싶지는 않았다."
    line_romanized: "Naneun i gippeumeul sesangui mueotgwado bakkugo sipjineun anatda."
    tags: ["受容", "妻の部屋", "最大級の喜び"]
    z_intensity: "medium"
    z_mode: "stable"
  - situation: "妻との親密さを得るための金がなく、布団の中で泣く。"
