work: "날개 (翼)"
narration:
  - files: ["ep01_prologue.txt"]
    narrator: "연심이の夫"
    style: "一人称・序文的独白（하오体）"
    notes: "地の文の「나／나는」は語り手自身を指し、「그대」に直接語りかける。後続章と同じ一人称人物として統合したが、33番地や妻への明示的言及はなく、同一性は作品の連続性に基づく推定である。"
  - files: ["ep02_33beonji.txt", "ep03_my_room.txt", "ep04_play_and_scent.txt", "ep05_money.txt", "ep06_first_outing.txt", "ep07_second_outing.txt", "ep08_illness.txt", "ep09_adalin.txt", "ep10_rooftop.txt"]
    narrator: "연심이の夫"
    style: "一人称・回想的内面独白"
    notes: "地の文の「나／나는／내가」は、33番地で妻と暮らす二十六歳の夫。外界への認識や妻の行動は、知識が乏しく睡眠薬も服用しているこの語り手の主観を通して記される。"

characters:
