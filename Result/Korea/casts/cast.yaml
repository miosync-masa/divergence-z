    dialogue_markers: "夫への短い指示や間接話法が中心。「옜소」、薬を「먹어야지」と勧める言葉、外出を禁じる言葉、帰宅時間についての囁き、ep09の「너 밤새워 가면서…」という激しい詰問。"
    disambiguation: "「너／네」は語り手が妻に向ける箇所では妻を指すが、ep09で妻が夫を罵る「너」は夫を指す。「저」はep08の妻の間接話法に限り妻自身。「그들」はep02では33番地の女性集団、ep05では客たちであり、通常は妻個人を指さない。"
    appears_in: ["ep02_33beonji.txt", "ep03_my_room.txt", "ep04_play_and_scent.txt", "ep05_money.txt", "ep06_first_outing.txt", "ep07_second_outing.txt", "ep08_illness.txt", "ep09_adalin.txt", "ep10_rooftop.txt"]
