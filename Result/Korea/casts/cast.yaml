      - expr: "네"
        where: "ep06の「네 오해」「네 말마따나」で妻を指す"
      - expr: "우리 부부"
        where: "ep07・ep10で語り手と妻を一組として指す"
      - expr: "절름발이"
        where: "ep10で語り手と妻から成る夫婦を表す比喩"
      - expr: "내나 아내나"
        where: "ep10で語り手と妻の双方を並べる表現"
      - expr: "두사람"
        where: "ep06で妻と「낯설은 남자」を一組として指す"
      - expr: "두 사람"
        where: "ep07で妻と「아내의 남자」を一組として指す"
    is_same_person_as_note: "ep09で語り手が妻の体臭を思い出しながら「연심이---」と呼ぶため、それ以前から「아내／내 아내」と呼ばれていた人物の名前が연심이だと分かる。ep01の抽象的な「여인」と同一人物かはuncertain。"
    role: "主人公の妻。夫に食事や金を与える一方、客を迎えて金を受け取り、夫にはアスピリンだとして薬を飲ませる。客との性的関係が強く示唆されるが、職業名は本文で明示されない。"
