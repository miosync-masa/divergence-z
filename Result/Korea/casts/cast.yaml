        where: "ep01で自己を説明する表現"
      - expr: "한 벌 신경"
        where: "ep04で睡眠から覚めた自己を比喩的に表す"
      - expr: "사뭇 딴 사람"
        where: "ep05で眠った後の自分を別人のようだと表す"
      - expr: "너"
        where: "ep09で妻が語り手を罵る言葉、およびep10で語り手が自分に問いかける二人称"
      - expr: "네"
        where: "ep06で語り手が妻の発言を内心で再現する「네 말마따나」。文脈上、妻から見た語り手ではなく妻を指す用例もあるため要注意"
      - expr: "얼빠진 사람"
        where: "ep10で駅をさまよう自分への比喩"
      - expr: "우리 부부"
        where: "ep07・ep10。語り手と妻を一組として指す複数表現"
      - expr: "절름발이"
        where: "ep10で足並みの合わない夫婦全体を表す比喩"
      - expr: "내나 아내나"
        where: "ep10で語り手と妻の双方を並べる表現"
    is_same_person_as_note: "ep02以降では一貫して妻を「아내」と呼ぶ無名の夫。ep10で生きてきた年月を「스물 여섯 해」と述べる。ep01の「나」も同じ作品内で連続する一人称として統合したが、同一人物である直接的な設定説明はない。"
    role: "物語の主人公兼語り手。妻に経済的・生活的に依存して部屋に閉じこもり、外出と金銭授受を契機に外界や自我への欲求を取り戻そうとする。"
    speaks: true
    dialogue_markers: "大部分は一人称の内面独白。「하오／굿바이」と語る序文、妻への内心の謝罪、「연심이---」という心中の呼びかけ、自問の「너는 인생에 무슨 욕심이 있느냐」、末尾の「날자」などで識別できる。"
    disambiguation: "ep09で妻が発する「너」は語り手を指す一方、語り手が妻へ向けて心中で使う「너／네」は妻を指す。ep10の「너는 인생에…」は語り手自身への呼びかけ。「내객」の「내」は一人称所有形ではなく「来客」という語の一部。"
    appears_in: ["ep01_prologue.txt", "ep02_33beonji.txt", "ep03_my_room.txt", "ep04_play_and_scent.txt", "ep05_money.txt", "ep06_first_outing.txt", "ep07_second_outing.txt", "ep08_illness.txt", "ep09_adalin.txt", "ep10_rooftop.txt"]
    importance: "main"

  - label: "연심이"
