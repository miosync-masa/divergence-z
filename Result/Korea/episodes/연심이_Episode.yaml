        tags: ["秘密露見", "激昂", "身体的暴力", "逆告発", "決裂"]

      - episode_id: "wife_as_mutual_misunderstanding"
        timeline: "main"
        chronological_order: 10
        title: "不在のまま残る相互誤解"
        source_episode: "ep10_rooftop.txt"
        summary: |
          夫が逃げた後、연심이は物語上の現在には姿を見せない。三越屋上にたどり着いた夫の意識には、彼女の首、アスピリン、アダリンが繰り返し浮かび、自分たちは互いに誤解している、足並みの合わない夫婦だと考える。
          夫は彼女のもとへ戻るべきか決められないまま、最後には再び飛ぶことへの希求へ向かう。彼女が夫の逃走をどう受け止めたか、帰還を待ったか、薬や来客について何を意図していたかは最後まで示されない。
        participants:
          - name: "연심이の夫"
            role: "夫／彼女との関係を再解釈する離脱者"
        emotional_impact: "critical"
        emotional_detail: |
          ここでの重大さは関係上の帰結であり、연심이自身の感情は完全に観測外にある。彼女は、夫にとって帰る可能性のある場所であると同時に、薬、金銭、秘密、暴力をめぐる解けない疑念の中心として残る。
        canonical_quotes: []
        z_relevance: |
          「互いに誤解している」という理解は夫だけの内面上の整理であり、彼女の同意や告白ではない。終幕の翻訳では、アダリン投与の目的、来客との関係、夫婦の再会を解決済みにせず、彼女の不在と未確定性を保つ。
        character_state_change:
          before: "夫と直接衝突し、彼が金を残して逃走する。"
          after: "夫の記憶と疑念の中に不在の妻として残り、関係は帰還の可否も含めて未解決となる。"
          permanent: true
        tags: ["余波", "相互誤解", "不在", "未解決", "結末"]

arcs:
  - arc_id: "care_and_control"
    title: "世話から身体管理へ"
    episodes: ["life_in_divided_rooms", "visitors_meals_and_coins", "rain_fever_and_daily_tablets", "adalin_box_discovery"]
    theme: "食事、衣服、金銭による生活維持が、外出、服薬、睡眠の管理へ拡大し、保護と統制の境界が崩れていく。"
    character_growth: |
      成長というより、연심이が担う管理領域の拡大として描かれる。夫の生活資源を扱う妻から、病気を看護し覚醒状態まで左右する存在へ移り、その行為はアダリン発見によって危険な意味へ反転する。
    z_translation_note: |
      世話の短い言葉を冷酷な命令だけにせず、同時に無条件の母性的愛情にも寄せない。薬の目的は本人から説明されないため、優しさと支配性を同じ発話の中に残す。

  - arc_id: "money_mediated_intimacy"
    title: "金銭を介して開閉する親密さ"
    episodes: ["visitors_meals_and_coins", "five_won_first_night", "two_won_shared_supper", "banknote_and_late_permission", "exposure_rage_and_separation"]
    theme: "銀貨や紙幣が、慰め、寝室への接近、共食、外出許可、そして別離のしるしとして夫婦間を往復する。"
    character_growth: |
      연심이は夫へ硬貨を与える側から、夫の持ち帰った金を受け取って寝床を開く側となり、さらに泣く夫へ紙幣を与える側へ戻る。言葉による交渉の代わりに、金銭の方向と空間の配分によって距離を調整する性質が強まる。
    z_translation_note: |
      金を単なる小道具として弱めず、誰が誰へ渡すかを正確に保つ。一方、寝室との連動だけを根拠に、彼女の感情や職業を明示的な取引契約として断定しない。

  - arc_id: "escalating_private_boundary_conflict"
    title: "境界侵入と怒りの段階的爆発"
    episodes: ["early_return_silent_anger", "rain_fever_and_daily_tablets", "adalin_box_discovery", "exposure_rage_and_separation"]
    theme: "夫による予期しない帰宅、来客場面の目撃、化粧台の探索、秘密の直接露見が重なり、彼女の反応が沈黙から身体的攻撃へ変化する。"
    character_growth: |
      最初の侵入では目と唇に怒りを漏らすだけだった연심이が、最後の露見では夫を掴み、噛みつき、「너」を用いて逆告発する。内面の変化は語られないが、表出方法は抑制から爆発へ明確に移行する。
    z_translation_note: |
      初期場面の沈黙を後の罵倒と同じ強度で訳さず、段階差を守る。最終場面では「너」、反復疑問、窃盗と女遊びの侮蔑語を弱めず、平常時との待遇落差を別の言語資源でも補償する。

  - arc_id: "unresolved_mutual_misunderstanding"
    title: "説明されない薬と解けない夫婦の誤解"
    episodes: ["adalin_box_discovery", "exposure_rage_and_separation", "wife_as_mutual_misunderstanding"]
    theme: "夫の薬への疑念、彼女の逆告発、夫による相互誤解という整理が交差するが、双方が直接説明し合うことはない。"
    character_growth: |
      연심이は自分の事情を説明する主体としてではなく、夫の疑念と回帰願望の中心として残る。衝突後も彼女の目的、罪責、愛情は確定せず、関係だけが修復不能に近い地点まで進む。
    z_translation_note: |
      夫の推論を客観的真実へ変えず、彼女の怒りを自白としても扱わない。「相互誤解」は夫の独白上の表現であることを保ち、終幕でも解釈の余白を閉じない。