          - quote: '나는 내 눈으로 절대로 보아서 안될 것을 그만 딱 보아 버리고 만 것이다.'
            context: "謝罪のため帰宅した直後、妻の部屋で禁じられた光景を目撃する。"
            z_intensity: "high"
            z_mode: "concern"
          - quote: '아파 죽겠다.'
            context: "妻に肌を噛まれ、分析を失って直接的な痛みだけが漏れる。"
            z_intensity: "high"
            z_mode: "release"
          - quote: '아내는 아무 말 없이 다소곳이 그렇게 안겨 들어가는 것이 내 눈에 여간 미운 것이 아니다. 밉다.'
            context: "男に抱かれて部屋へ戻る妻を見て、憎しみが一語へ凝縮する。"
            z_intensity: "high"
            z_mode: "release"
          - quote: '이것은 참 너무 억울하다. 나는 어안이 벙벙하여 도무지 입이 떨어지지를 않았다.'
            context: "妻から不実を責められ、反論したいのに現実には話せなくなる。"
            z_intensity: "high"
            z_mode: "grief"
          - quote: '나는 그냥 줄달음박질을 쳐서 나와 버렸다.'
            context: "残金を置いた後、対決せず家から走り去る。"
            z_intensity: "high"
            z_mode: "release"
        z_relevance: |
          「殺そうとしたのではないか」という反論は、叫びたいと思っただけで実際には発話されない。内面の「아파 죽겠다」「밉다」と外面の沈黙を明確に分ける。目撃内容は具体化せず、金を置く意味も支払い、宥め、別れのいずれか一つへ固定しない。
        character_state_change:
          before: "妻を疑った自分を責め、関係修復のため謝罪しようとしている。"
          after: "妻への憎しみと冤罪感を抱きながら、言葉では対抗できず生活圏から逃走する。"
          permanent: true
        tags: ["暴力", "裏切り", "発話停止", "逃走", "関係破綻"]

      - episode_id: "rooftop_numbness_and_mutual_misunderstanding"
        timeline: "main"
        chronological_order: 15
        title: "三越屋上の虚無と相互誤解"
        source_episode: "ep10_rooftop.txt"
        summary: |
          家から逃げた彼は京城駅でコーヒーを求めるが、残金をすべて置いてきたため飲めない。行き先も分からないまま歩き、気づくと三越屋上にいる。二十六年の人生を回想しても題目を見つけられず、自分に人生への欲望があるかと問い、存在の認識さえ難しくなる。五月の日差しの中で金魚を観察し、疲れた都市を見下ろしながら、妻との関係を一方の悪意ではなく相互の誤解と、歩調の合わない夫婦の運命として再び抽象化する。
        participants:
          - name: "연심이"
            role: "不在のまま、帰還と夫婦関係を考えさせる妻"
          - name: "三越屋上の金魚たち"
            role: "虚無の中で彼の観察力を一時的に安定させる対象"
          - name: "都市の匿名の人々"
            role: "眼下で活動し続ける都市生活の担い手"
        emotional_impact: "critical"
        emotional_detail: |
          怒りの直後に訪れるのは解放感ではなく、金、行き先、自己像を失った空虚さである。金魚の生命感だけが一時的に感覚をつなぎ止める。妻との破局さえ「相互誤解」という観念へ変えることで、彼は再び一方的な断罪を避けるが、帰るべきかは決められない。
        canonical_quotes:
          - quote: '커피! 좋다.'
            context: "逃走後の苦い口を鎮めるため、駅でコーヒーを求める。"
            z_intensity: "medium"
            z_mode: "release"
          - quote: '나는 또 내 자신에게 물어 보았다. 너는 인생에 무슨 욕심이 있느냐고, 그러나 있다고도 없다고 도 그런 대답은 하기가 싫었다.'
            context: "自分を二人称化し、人生への欲望を問いながら答えを拒む。"
            z_intensity: "high"
            z_mode: "grief"
          - quote: '나는 거의 나 자신의 존재를 인식하기조차도 어려웠다.'
            context: "妻の家と行き先を失い、自己の存在感まで希薄になる。"
            z_intensity: "high"
            z_mode: "grief"
          - quote: '금붕어는 참 잘들도 생겼다. 작은놈은 작은놈대로 큰놈은 큰놈대로 다 싱싱하니 보기 좋았다.'
            context: "屋上の金魚を大小それぞれの生命力として静かに観察する。"
            z_intensity: "low"
            z_mode: "stable"
          - quote: '우리들은 서로 오해하고 있느니라.'
            context: "夫婦の破局を、互いの誤解という構造へ捉え直す。"
            z_intensity: "medium"
            z_mode: "concern"
        z_relevance: |
          自問の「너」は妻ではなく自分自身を指す。「互いに誤解している」は客観的な和解宣言ではなく、妻を断罪しきれない彼の再抽象化である。金魚の細部へ戻る静かな観察と、存在希薄化の重い内語を対照させる。
        character_state_change:
          before: "妻への痛みと憎しみを抱え、家から衝動的に逃げている。"
          after: "怒りを虚無と相互誤解の観念へ変えるが、帰る場所も欲望も決められない。"
          permanent: false
        tags: ["三越屋上", "虚無", "自己問答", "金魚", "相互誤解"]

      - episode_id: "wings_reawaken"
        timeline: "main"
        chronological_order: 16
        title: "失われた翼への再覚醒"
        source_episode: "ep10_rooftop.txt"
        summary: |
          正午のサイレンが鳴り、都市全体が激しく動き出す瞬間、彼は突然わきの下の痒みを感じる。それを今は失われた人工の翼が生えていた痕跡だと捉え、頭の中で消されていた希望と野心を思い出す。歩みを止め、翼よ再び生えよ、もう一度だけ飛ぼうと叫んでみたいと願う。実際に飛んだ事実は示されないが、無為と虚無の語りは初めて直接的な意志へ変わる。
        participants:
          - name: "都市の匿名の人々"
            role: "正午の運動によって再覚醒を促す群衆"
        emotional_impact: "critical"
        emotional_detail: |
          回復は論理的な結論や妻との和解からではなく、痒み、サイレン、都市の生命感という身体的刺激から生じる。長く抑圧されていた希望が、分析や弁明を越えて命令形と反復になり、最後の瞬間に主体性を取り戻す。
        canonical_quotes:
          - quote: '나는 불현듯 겨드랑이가 가렵다.'
            context: "正午の都市の動きの中で、翼の記憶につながる身体感覚が突然生じる。"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: '아하, 그것은 내 인공의 날개가 돋았던 자국이다. 오늘은 없는 이 날개.'
            context: "わきの痒みを、失われた人工の翼の痕跡として認識する。"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: '머릿속에서는 희망과 야심이 말소된 페이지가 딕셔너리 넘어가듯 번뜩였다.'
            context: "自分の中から希望と野心が消されていたことを思い出す。"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: '날개야 다시 돋아라.'
            context: "再び翼を得たいという願いが、直接的な命令形になる。"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: '날자. 날자. 한 번만 더 날자꾸나.'
            context: "自分自身へ、もう一度だけ飛ぼうと反復して呼びかける。"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: '한 번만 더 날아 보자꾸나.'
            context: "作品を閉じる、再挑戦への切実な内的呼びかけ。"
            z_intensity: "high"
            z_mode: "resolve"
        z_relevance: |
          直前に「叫んでみたい」と記されているため、末尾の言葉を実際に声へ出した確定台詞にしない。翼も実際に再生したとは断定せず、身体感覚から生じた再生願望として扱う。長い分析文から短い命令形へ切り替わる速度と、「날자」の反復を最優先で保持する。
        character_state_change:
          before: "自己の存在も行き先も定められず、妻との関係を抽象化して立ち尽くしている。"
          after: "失われた希望と野心を認識し、もう一度飛ぼうとする意志を言語化する。"
          permanent: true
        tags: ["覚醒", "翼", "希望", "主体性", "終幕"]

arcs:
  - arc_id: "intellectualization_to_direct_cry"
    title: "研究する語りから直接的な叫びへ"
    episodes: ["prologue_intellectual_mask", "money_visitors_and_pleasure_question", "five_won_handover_and_first_night", "adalin_discovery_and_overdose", "suspicion_reversed_into_guilt", "violent_rupture_and_escape", "rooftop_numbness_and_mutual_misunderstanding", "wings_reawaken"]
    theme: "危険な感情を機知や研究へ変える語りが、衝撃と身体感覚によって短い痛み、憎しみ、飛翔の意志へ崩れていく過程。"
    character_growth: |
      当初は恋愛も感情も逆説として処理し、妻の客や金も研究対象へ変えていた。薬物と暴力を経験すると論理は維持できなくなり、最後には説明ではなく「飛ぼう」という直接的な自己呼びかけへ到達する。
    z_translation_note: |
      平常時の抽象語、長文、自己訂正と、高負荷時の短文・反復を均一化しない。「研究」「誤解」といった知性化の語彙が、「아파 죽겠다」「밉다」「날자」へ急落する振幅がこの人物の感情曲線を作る。

  - arc_id: "sleep_refuge_to_forced_sleep"
    title: "安らぎの睡眠から管理された睡眠へ"
    episodes: ["absolute_room_and_divided_fate", "sensory_play_and_social_withdrawal", "station_refuge_rain_and_collapse", "illness_and_daily_tablets", "adalin_discovery_and_overdose"]
    theme: "自ら選んだ寝床と睡眠が、妻の薬によって外界と真相から隔離する手段へ変質する。"
    character_growth: |
      暗い部屋と寝具は当初、社会的要求から自由になれる絶対的な安全地帯だった。しかし雨の外出後、妻の錠剤によって睡眠が反復され、アダリンの発見により安全と拘束の境界が崩れる。彼はその衝撃を処理できず、自ら残薬を飲むことで管理された睡眠を自己破壊的に反復する。
    z_translation_note: |
      同じ「眠る」でも、初期は安堵、中盤は病的崩落、服薬期は無自覚な管理、過量服用時は衝動的な放棄を表す。各場面の主体性と感情価を訳し分け、睡眠を一貫して穏やかな休息として扱わない。

  - arc_id: "money_mediated_intimacy"
    title: "金銭を介した親密さ"
    episodes: ["money_visitors_and_pleasure_question", "first_outing_and_early_return", "five_won_handover_and_first_night", "second_handover_and_acceptance", "moneyless_tears_and_wifes_aid", "violent_rupture_and_escape"]
    theme: "使うことのできない金が、妻との接近、受容、許可、最終的な別離を伝える代替言語になる。"
    character_growth: |
      銀貨は最初、触感だけが楽しい無意味な物だった。五ウォンを妻へ渡して初めて妻の寝床へ入れたことで、彼は金を親密さの儀式と理解し、再現を求める。破局時には残金を敷居へ置き、同じ身振りを関係から逃れるために用いる。
    z_translation_note: |
      金額や経済取引だけを前景化せず、手渡す触覚、妻の無言の受容、寝床への接近を一続きに扱う。終盤で金を置く行為は、以前の親密さを反転させるため、単純な支払いや返済と限定しない。

  - arc_id: "idealization_suspicion_and_rupture"
    title: "妻の理想化、疑念、自己非難、破局"
    episodes: ["thirty_three_isolation_and_wife_idealization", "money_visitors_and_pleasure_question", "first_outing_and_early_return", "station_refuge_rain_and_collapse", "illness_and_daily_tablets", "adalin_discovery_and_overdose", "suspicion_reversed_into_guilt", "violent_rupture_and_escape", "rooftop_numbness_and_mutual_misunderstanding"]
    theme: "最も美しい花として崇めた妻を疑いながら、その疑いを自責によって打ち消し、直接的な暴力と目撃によってようやく生活圏から離脱するまで。"
    character_growth: |
      客、金、囁き、薬という証拠が増えても、彼は妻に有利な説明を作り、疑った自分を責める。視覚的な目撃、身体的攻撃、妻からの非難が重なった時に初めて逃走するが、屋上ではなお夫婦を相互誤解として捉え直し、妻を完全には断罪しない。
    z_translation_note: |
      妻の意図を全知的に確定せず、彼の限定された知識と揺れる推論を維持する。「틀림없다」に相当する断定の直後に別の可能性を作る反転を省かない。怒りがあっても現実の対話では沈黙する点が重要である。

  - arc_id: "confinement_to_flight"
    title: "閉鎖された部屋から再飛翔へ"
    episodes: ["thirty_three_isolation_and_wife_idealization", "absolute_room_and_divided_fate", "first_outing_and_early_return", "station_refuge_rain_and_collapse", "violent_rupture_and_escape", "rooftop_numbness_and_mutual_misunderstanding", "wings_reawaken"]
    theme: "暗い部屋を最適な世界として受け入れた人物が、失敗する外出と破局を経て、最後にもう一度外界へ向かう意志を取り戻す。"
    character_growth: |
      初期の彼は閉鎖と無為を苦痛ではなく絶対的安逸として選び、外出しても疲労によって戻っていた。妻の家から逃げた後は帰る場所も自己認識も失うが、正午の都市と身体の痒みを契機に、失われた希望と野心を自覚する。実際の飛翔は描かれないものの、終幕では少なくとも飛ぼうとする意志が生まれる。
    z_translation_note: |
      初期の部屋への愛着を単なる抑圧として訳すと、終幕の転換が弱くなる。最後の飛翔は成功した行動ではなく切実な願望であり、「もう一度だけ」という反復に、長い無為と失敗した外出の全重量を持たせる。