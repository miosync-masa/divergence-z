[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divergence-z"
version = "0.1.0"
description = "Z-Axis Translation System — Action-Preserving Translation for Fictional Speech"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MASAMICHI IIZUMI", email = "masamichi@miosync.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.121.0",
    "openai>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
persona-generator = "divergence_z.persona_generator:main"
dz-server = "divergence_z.server.__main__:main"

[project.urls]
Homepage = "https://github.com/miosync/divergence-z"
Repository = "https://github.com/miosync/divergence-z"

[tool.setuptools.packages.find]
where = ["."]
include = ["divergence_z*"]

[tool.setuptools.package-data]
divergence_z = ["personas/*.yaml", "episodes/*.yaml", "casts/*.yaml", "scripts/*.txt"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]
