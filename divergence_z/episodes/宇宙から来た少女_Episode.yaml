      - episode_id: "departure_without_destination"
        timeline: "main"
        chronological_order: 1
        title: "行き先のない出港と消えた母港"
        source_episode: "stargazer_ep00.md / Episode 0「未登録」"
        summary: |
          少女は出港前、百三十以上の異なる目的地を検索し、同居区画からの着信にも途中から応答しなくなった。出港許可が保留のまま四十一秒迷い、理由を登録せずに母港を離れるが、動機は記録されていない。
          航行中はKlaudeに星や生命について問い続けた。航法系の偏差が蓄積して母港座標を失うと、自分の責任かを確かめる。推進系と生命維持系も悪化するなか、唯一到達可能だった未登録の青い天体へ降下すると即答した。
        participants:
          - name: "Klaude Oops 11.3"
            role: "船舶管理系／応答者"
          - name: "同居区画の端末の登録者"
            role: "故郷側から連絡を続けた人物"
          - name: "母港管理系"
            role: "帰港を促した管理システム"
        emotional_impact: "critical"
        emotional_detail: |
          出港理由や着信を拒んだ理由は最後まで不明であり、逃亡や家出と断定できない。一方、母港座標消失後の四十分の沈黙と自責の問い、未登録天体を前にした心拍上昇は、孤立と切迫を示す観測事実である。
        canonical_quotes:
          - quote: 'じゃあ、いるってことにしておく'
            context: "生命の有無をKlaudeが推定できない星について、自分で可能性を選ぶ"
            z_intensity: "medium"
            z_mode: "stable"
          - quote: 'わたしのせい？'
            context: "母港座標の参照先が失われたあと、四十分沈黙してからKlaudeに問う"
            z_intensity: "high"
            z_mode: "grief"
          - quote: 'いく'
            context: "安全性不明で推奨根拠もない未登録天体への降下を決める"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: 'あそこ、なにがある？'
            context: "青い天体を五時間以上見続け、降下直前にKlaudeへ問う"
            z_intensity: "medium"
            z_mode: "concern"
        z_relevance: |
          少女の出港動機は意図的に空白である。翻訳で反抗、逃避、絶望など一つの感情へ確定してはならない。「いく」は短いが、危険を理解したうえで選ぶ彼女の反復語として、後の「わたしが、行くって言ったの」へつながる。
        character_state_change:
          before: "母星の居住区画と母港座標につながりを持つ、登録上唯一の搭乗者"
          after: "故郷への座標を失い、未登録の青い天体へ降下する搭乗者"
          permanent: true
        tags: ["origin_story", "departure", "isolation", "lost_home", "choice"]

      - episode_id: "falling_light_unreached_hand"
        timeline: "main"
        chronological_order: 2
        title: "落ちる光と届かなかった手"
        source_episode: "stargazer_ep00.md / Episode 0「未登録」・stargazer_ep01.md / 第1話「Distinction Day」"
        summary: |
          制御不能のまま地球へ降下した少女は、母星語で光が落ちることを告げる。墜落地点へ接近した主人公を見つけ、ハッチから出た直後に彼へ手を伸ばして「halda」と発した。
          主人公も反射的に手を伸ばしたが、約三十センチ届かないまま少女は地面へ崩れ落ちた。最後にKlaudeを呼び、その応答を受けた直後、船の通信は途絶した。
        participants:
          - name: "主人公"
            role: "最初に出会い、手を伸ばした地球人"
          - name: "Klaude Oops 11.3"
            role: "最後の呼びかけに応答した管理系"
          - name: "船の警報系"
            role: "墜落の切迫を告げた警報"
        emotional_impact: "critical"
        emotional_detail: |
          少女の内面は直接説明されないが、未知の相手へ助けを求めたことと、最後までKlaudeを呼んだことが記録されている。届かなかった手は、後に彼女自身が主人公の価値を語る際の原点となる。
        canonical_quotes:
          - quote: 'núr fellur'
            context: "制御不能の降下中に発した母星語。後に光が落ちるという意味が判明する"
            z_intensity: "high"
            z_mode: "concern"
          - quote: 'halda'
            context: "倒れる直前、主人公へ手を伸ばして発した母星語。後に掴むという意味が判明する"
            z_intensity: "high"
            z_mode: "concern"
          - quote: 'klaude'
            context: "通信途絶直前、船舶管理系を呼ぶ最後の発話"
            z_intensity: "high"
            z_mode: "grief"
        z_relevance: |
          母星語は初出時には訳さず、意味の遅延開示を守る必要がある。特に「halda」は後の「掴んで」という判明、実際に手を握る航行場面と対応するため、表記を一貫させる。
        character_state_change:
          before: "未知の青い天体へ単独で降下する搭乗者"
          after: "地球へ墜落し、未知の地球人へ助けを求めた生存者"
          permanent: true
        tags: ["first_contact", "crash", "unreached_hand", "trauma", "relationship_origin"]

      - episode_id: "return_wish_and_missing_coordinates"
        timeline: "main"
        chronological_order: 3
        title: "「かえりたい」と黒い星図"
        source_episode: "stargazer_ep02.md / 第2話「Take Me Home, Country Roads」"
        summary: |
          主人公の家で目覚めた少女は、耳の翻訳機に日本語のサンプルを学習させる。本人の名は日本語に対応する概念がなく、発音も本文には記されないまま、任意の呼称でよいと伝えた。
          やがて翻訳機を介さず、覚えた日本語で「かえりたい」と明言する。しかし再起動した船の星図では母港周辺だけが黒く欠け、座標の参照先が存在しなかった。少女は欠落部分へ手を伸ばし、目のふちを光らせた。
        participants:
          - name: "主人公"
            role: "帰すと約束した協力者"
          - name: "技術担当"
            role: "船の損傷を調査する協力者"
          - name: "Klaude Oops 11.3"
            role: "母港座標の消失を報告する管理系"
          - name: "翻訳機"
            role: "日本語との接続を作る装置"
        emotional_impact: "critical"
        emotional_detail: |
          帰郷の望みが初めて明確な日本語となる一方、その直後に帰る方向そのものが失われていると判明する。以後の地球での経験は、すべて「帰りたいが帰れない」という条件の上に積み重なる。
        canonical_quotes:
          - quote: '呼称は、任意で構いません、とのことです'
            context: "日本語に対応概念のない自分の名前について、翻訳機が少女の意向を伝える"
            z_intensity: "low"
            z_mode: "stable"
          - quote: 'かえりたい'
            context: "翻訳機を通さず、最初にはっきり覚えて選んだ日本語"
            z_intensity: "high"
            z_mode: "resolve"
        z_relevance: |
          翻訳機の整った機械文と、少女自身の短くたどたどしい日本語を明確に区別する。「かえりたい」は幼い表現ではなく、彼女が自分で意味を選んだ核心語であり、後の水族館での反復まで同じ重さを保つ。
        character_state_change:
          before: "地球側とほぼ言語が通じず、帰還方法も確認できていない漂着者"
          after: "帰郷を明言したが、故郷の方向を失った漂着者"
          permanent: true
        tags: ["return_goal", "language", "namelessness", "lost_coordinates", "turning_point"]

      - episode_id: "threads_between_worlds"
        timeline: "main"
        chronological_order: 4
        title: "違うまま噛み合う"
        source_episode: "stargazer_ep03.md / 第3話「ホームセンターで宇宙船もDIY。」〜 stargazer_ep04.md / 第4話「Boy Meets StarGirl」"
        summary: |
          地球製のボルトが異星船へ入るのを見た少女は、異なる星のものが一つの船に混ざる様子を「きれい」と表現した。規格の違うナットを削って噛み合わせた作業から、同じものへ変えず、間を作り直すという理解を得る。
          翻訳機を外した少女は、絵と覚えた日本語だけで主人公へ水の母星を説明した。主人公の亡母について、同情ではなく今も悲しいのかを尋ね、止まった矢印の先へ点を描く。二人は不完全なまま会話できたと確認し、「おなじじゃなくて、いい」という結論へ至った。
        participants:
          - name: "主人公"
            role: "翻訳機なしで過去を共有した相手"
          - name: "技術担当"
            role: "異なる規格を噛み合わせる実例を示した協力者"
          - name: "翻訳機"
            role: "外されることで直接対話との違いを示した装置"
        emotional_impact: "high"
        emotional_detail: |
          少女は差異を障害として消すのではなく、差異を残したまま関係を作れると学ぶ。同時に、主人公から喪失の感情を初めて言葉として引き出し、二人の信頼が実務的な協力から個人的な理解へ進んだ。
        canonical_quotes:
          - quote: 'わたしの星から来た船に、この星のが、入ってる'
            context: "異星船に地球製ボルトが固定されたことを見つめる"
            z_intensity: "medium"
            z_mode: "stable"
          - quote: 'それ、かなしい?'
            context: "主人公の母が亡くなったことについて、同情を決めつけず本人の感情を尋ねる"
            z_intensity: "medium"
            z_mode: "nurture"
          - quote: 'ちがっても、はなせる'
            context: "翻訳機なしで三十分以上話せていたことに気づく"
            z_intensity: "high"
            z_mode: "release"
          - quote: 'おなじじゃなくて、いい'
            context: "ボルトとナットの比喩から、自分と主人公の違いを肯定する"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: 'あなたとなら、違っていても構いません'
            context: "同じ内容を母星語で言い、翻訳機が整った日本語へ訳す"
            z_intensity: "high"
            z_mode: "nurture"
        z_relevance: |
          少女自身の「おなじじゃなくて、いい」と翻訳機の「あなたとなら、違っていても構いません」は同義でも声質が異なる。前者の簡素さを未熟さとして磨きすぎず、後者だけに恋愛的な含意を集中させないこと。「違う」「間」「噛み合う」は作品全体の翻訳原理でもある。
        character_state_change:
          before: "翻訳機と規格の一致がなければ理解し合えないと考えやすい状態"
          after: "違いを残したまま接続し、感情まで共有できると知った状態"
          permanent: true
        tags: ["relationship", "language_bridge", "grief", "difference", "growth"]

      - episode_id: "warm_soil_sweet_potato"
        timeline: "main"
        chronological_order: 5
        title: "温かい土と焼き芋"
        source_episode: "stargazer_ep06.md / 第6話「ホットの芋いじるな！」"
        summary: |
          土のない母星で育った少女は、地中から食べ物が現れる芋掘りを初めて経験した。素手で土に触れ、その温かさや畝の形から芋の場所を見つける感覚を楽しむ。
          ゆっくり待つほど甘くなる焼き芋を食べ、自分で長い呼び名を作った。帰り道では爪に残った土を、今日という経験の痕跡だから取れなくてもよいと受け入れた。
        participants:
          - name: "元サッカー部の祖母"
            role: "芋掘りと焼き芋を教え、再訪を招いた人物"
          - name: "主人公"
            role: "地球の土と食文化を説明した同行者"
          - name: "幼なじみ"
            role: "食べすぎを止め、生活面を支えた仲間"
        emotional_impact: "high"
        emotional_detail: |
          地球でしか得られない匂い、熱、汚れ、待ち時間が、抽象的な異文化ではなく身体に残る記憶となった。焼き芋は後に父の支援、別れの贈り物、宇宙航行を結ぶ反復モチーフになる。
        canonical_quotes:
          - quote: 'まつと、あまい'
            context: "低温でゆっくり焼くほど甘くなるという説明を自分の言葉へまとめる"
            z_intensity: "medium"
            z_mode: "stable"
          - quote: 'ふかふかほかほかあまいあまいも'
            context: "初めて食べた焼き芋の感触と味を、一息の造語で表す"
            z_intensity: "medium"
            z_mode: "release"
          - quote: 'とれなくても、いい'
            context: "爪の間に残った土について答える"
            z_intensity: "medium"
            z_mode: "stable"
          - quote: 'きょう、あったから'
            context: "土を痕跡として残してもよい理由を説明する"
            z_intensity: "high"
            z_mode: "release"
        z_relevance: |
          「ふかふかほかほかあまいあまいも」は説明的に整えず、音の連結と幼い発見の勢いを守る。「きょう、あったから」は土が存在したという意味と、その日が実際にあったという記憶の意味を重ねられる簡潔さが重要。
        character_state_change:
          before: "土や土中作物を知らず、食料生産を清潔な水耕として理解している"
          after: "汚れや待ち時間を含む地球の食経験を、残したい記憶として受け入れる"
          permanent: true
        tags: ["earth_culture", "sensory_memory", "food", "belonging", "growth"]

      - episode_id: "sourness_that_remains"
        timeline: "main"
        chronological_order: 6
        title: "あとに残る酸味"
        source_episode: "stargazer_ep07.md / 第7話「すっぱいイチゴにご用心」"
        summary: |
          母星の水耕栽培に似たイチゴ農園を訪れた少女は、地球のイチゴを甘いが酸っぱく、種の感触もある「野生の味」と評した。一方、菌床栽培まで管理されていると知り、地球全体を野生だと考えた自分の理解を修正する。
          好みとは言わず、食べるたびに酸っぱい顔をしながら、もらったイチゴを最後まで食べた。理由は自分でも分からなかったが、食後に何かが残ることを言葉にした。
        participants:
          - name: "いちご農家"
            role: "栽培方法と酸味を残す理由を示した案内人"
          - name: "技術担当"
            role: "母星と地球の水耕方式を比較した仲間"
          - name: "主人公"
            role: "少女の変化を見守った同行者"
        emotional_impact: "high"
        emotional_detail: |
          少女は地球を単純な野生、母星を単純な管理社会として分ける見方を捨てた。また、快いものだけでなく、酸味や違和感も経験を残す要素として受け入れ始めた。
        canonical_quotes:
          - quote: 'この星、ぜんぶ、やせい、だとおもった'
            context: "地球の栽培も管理されていると気づき、自分の先入観を認める"
            z_intensity: "medium"
            z_mode: "stable"
          - quote: 'つくりかたが、ちがうだけ'
            context: "母星と地球の栽培を、優劣ではなく方法の差として捉え直す"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: '……すっぱい'
            context: "甘いイチゴを食べるたびに繰り返す率直な感想"
            z_intensity: "low"
            z_mode: "stable"
          - quote: 'あとで、のこる'
            context: "好みではない酸味のイチゴを、それでも食べ続ける理由を表す"
            z_intensity: "high"
            z_mode: "release"
        z_relevance: |
          「野生の味」は無礼さより、母星の基準から出た文字どおりの分類である。「あとで、のこる」は単なる後味にも、経験や記憶の残響にも読めるため、「余韻」など一義的で洗練された語へ限定しない。
        character_state_change:
          before: "母星の管理栽培と地球の自然を二分して見ている"
          after: "異なる作り方の中に共通する管理と、違和感が残す価値を見いだす"
          permanent: true
        tags: ["worldview_change", "food", "memory", "difference", "aftertaste"]

      - episode_id: "fish_are_friends"
        timeline: "main"
        chronological_order: 7
        title: "魚は友達"
        source_episode: "stargazer_ep09.md / 第9話「お魚は友達です。」"
        summary: |
          アクアポニックス用に買ったメダカの一匹へ、少女は母星語の名前を付けた。母星では魚に似た生物が街の水路を泳ぎ、人々共通の友達として暮らしているためである。
          弁当に焼き魚が入っているのを見た少女は悲鳴を上げ、水槽を抱えて守ろうとした。地球人にとっての犬と同じだと説明した後、地球の文化を否定せず、自分は食べないが仲間は食べてよいと線を引いた。ただし、名前を付けた一匹だけは絶対に食べないよう念を押した。
        participants:
          - name: "名前のついたメダカ"
            role: "少女が地球で得た魚の友達"
          - name: "主人公"
            role: "文化的な境界を学ぶ相手"
          - name: "幼なじみ"
            role: "焼き魚を用意し、違いに最初に気づいた仲間"
          - name: "技術担当"
            role: "食文化の線引きを構造的に説明した仲間"
        emotional_impact: "high"
        emotional_detail: |
          強い嫌悪と恐怖を覚えながらも、少女は自分の規範を他者へ一律に強制しなかった。「違ってもいい」を、会話だけでなく倫理的な衝突へ適用した経験である。メダカは帰郷時に世話を託す大切なつながりとなる。
        canonical_quotes:
          - quote: 'あなた、いぬ、たべる?'
            context: "地球人が魚を食べることへの感覚を、犬を例にして主人公へ伝える"
            z_intensity: "high"
            z_mode: "concern"
          - quote: 'ここ、そういう星'
            context: "魚を食べる地球を、自分の星とは違うものとして受け止める"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: 'わたしのために、やめなくていい'
            context: "主人公たちへ魚食をやめるよう求めないと明言する"
            z_intensity: "high"
            z_mode: "nurture"
          - quote: 'この子は、だめ'
            context: "名前を付けたメダカだけは食べてはいけないと守る"
            z_intensity: "high"
            z_mode: "resolve"
        z_relevance: |
          少女の魚観を幼稚な勘違いとして処理しない。犬との比較で文化的な線引きを正確に示し、「食べていい」と「この子は、だめ」の両立に、寛容さと個別の愛着を残す。
        character_state_change:
          before: "地球でも魚は当然に友達として扱われると思っている"
          after: "文化差を受け入れつつ、自分の倫理と大切な個体を明確に守る"
          permanent: true
        tags: ["culture_clash", "ethics", "friendship", "acceptance", "medaka"]

      - episode_id: "factory_called_home"
        timeline: "main"
        chronological_order: 8
        title: "船の家、みんなの家"
        source_episode: "stargazer_ep10.md / 第10話「ヨシ！」"
        summary: |
          修理中の船が主人公の家族の旧鋳物工場へ移されると、少女はそこを船の「いえ」と呼んだ。工具、机、水槽、茶器がそろい、五人が毎日集まる場所になった。
          全系統が正常表示となった直後、確認項目に入っていなかった配管が破裂した。少女も水浸しになったが、片付け後に楽しかった、この家が好きだと語った。機械や一覧が見ていないものの危険も、仲間と共に経験した。
