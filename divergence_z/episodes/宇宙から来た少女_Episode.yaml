        emotional_impact: "critical"
        emotional_detail: |
          少女は帰郷への望みを一度も捨てていなかったが、地球が単なる異郷ではなく、離れがたい人々のいる場所になっていた。二つの願いを統合せず、そのまま並べて口にしたことが別れの核心である。
        canonical_quotes:
          - quote: 'そとを、しらない'
            context: "安全な水槽から出られない魚について語る"
            z_intensity: "medium"
            z_mode: "grief"
          - quote: '――帰りたいよ'
            context: "水族館のトンネルで、主人公へ帰郷の本心を明言する"
            z_intensity: "high"
            z_mode: "grief"
          - quote: 'まいにち、かえりたかった'
            context: "地球を楽しんでいた間も、毎日故郷を望んでいたと伝える"
            z_intensity: "high"
            z_mode: "grief"
          - quote: '……はなれたく、ない'
            context: "帰りたいという告白に続けて、主人公たちとの別離も拒む"
            z_intensity: "high"
            z_mode: "grief"
          - quote: 'この子、たのむね'
            context: "出発前夜、名前を付けたメダカの世話を主人公へ託す"
            z_intensity: "high"
            z_mode: "nurture"
        z_relevance: |
          「帰りたい」と「離れたくない」を矛盾解消させず、両方とも真実として訳す。最初だけ漢字の「帰りたいよ」、続くひらがなの反復、最後のためらいを含む「はなれたく、ない」のリズムを意識する。マンタの影の十秒は、接吻など特定の出来事へ確定しない。
        character_state_change:
          before: "帰還を目前にしながら、別れを十分には言葉にしていない"
          after: "故郷と地球の双方を求める本心を明かし、地球に残す命を託す"
          permanent: true
        tags: ["farewell", "confession", "two_homes", "medaka", "critical_relationship"]

      - episode_id: "shared_pilot_decision"
        timeline: "main"
        chronological_order: 16
        title: "一人では帰れない"
        source_episode: "stargazer_ep21.md / 第21話「fly me to the star」"
        summary: |
          出発直前、衰弱した少女は八十時間の航行を続ける操縦適性がないと判定された。有人時の完全自律航行も規定で禁じられ、少女は地球へ残ると言い出す。残れば死ぬ可能性を否定できなかった。
          主人公が操縦者として同行すると申し出ると、少女は彼が帰れない危険を理由に拒んだ。主人公が恐怖を認めたうえで行くと決めると、声を出さずに泣き、同行を受け入れた。必要な訓練のため、出発は五日延期された。
        participants:
          - name: "主人公"
            role: "往復の操縦を引き受けた同行者"
          - name: "Klaude Oops 11.3"
            role: "操縦適性と規定を判定した管理系"
          - name: "技術担当"
            role: "規定を破らず人が見る必要性を説明した仲間"
          - name: "元サッカー部"
            role: "自らも操縦候補へ志願した仲間"
          - name: "幼なじみ"
            role: "少女の背へ手を置いて支えた仲間"
        emotional_impact: "critical"
        emotional_detail: |
          少女は自分が助かるために主人公を危険へ巻き込みたくなく、帰郷を諦めようとした。しかし主人公が自分の選択として恐怖ごと引き受けたことで、単独帰還から二人の航行へ未来が変わった。五日の延期を、別れの猶予としても受け取った。
        canonical_quotes:
          - quote: 'いかなくて、いい'
            context: "自分に操縦適性がないと判明し、帰還そのものを諦めようとする"
            z_intensity: "high"
            z_mode: "grief"
          - quote: 'ここに、いる'
            context: "身体が地球に耐えないと分かりながら、仲間を危険へ巻き込まない選択を示す"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: 'あなた、かえれない'
            context: "主人公の同行案へ、帰還できない可能性を突きつける"
            z_intensity: "high"
            z_mode: "concern"
          - quote: 'こわくない?'
            context: "主人公が未知の往復航行を選ぶことへの恐怖を確認する"
            z_intensity: "high"
            z_mode: "concern"
          - quote: 'あと五日、いられるってことだよね'
            context: "訓練時間による延期を、皆といられる追加の時間として捉える"
            z_intensity: "high"
            z_mode: "release"
        z_relevance: |
          「ここに、いる」は地球を選んで帰郷願望を捨てた台詞ではなく、主人公を守るための自己犠牲である。「こわくない？」に対する主人公の即答と合わせ、勇気を無恐怖として訳さない。最後の五日は安堵と別れの延期が同居する。
        character_state_change:
          before: "一人で母星へ帰る予定だったが、身体的に操縦不能となった"
          after: "主人公と危険を共有し、二人で母星へ向かうことを受け入れた"
          permanent: true
        tags: ["shared_journey", "self_sacrifice", "pilot", "choice", "turning_point"]

      - episode_id: "farewell_launch"
        timeline: "main"
        chronological_order: 17
        title: "アインツ、ツヴァイ、トライ"
        source_episode: "stargazer_ep22.md / 第22話「アインツ、ツヴァイ、トライ。」"
        summary: |
          主人公の訓練が完了し、少女は父が追加で届けた断熱材を船へ貼る作業に参加した。幼なじみが焼いた芋を断熱材で包み、地球から持ち帰る食べ物として受け取る。
          出発前、幼なじみから主人公を必ず返すよう頼まれ、指切りで約束した。水槽を最後に見たあと主人公と乗船し、仲間の掛け声に合わせて離陸する。三つの声で船が飛び、四つ目の「スター」は大気圏を抜けてから口にした。
        participants:
          - name: "主人公"
            role: "共に母星へ向かう操縦者"
          - name: "幼なじみ"
            role: "主人公の帰還を託し、焼き芋を持たせた仲間"
          - name: "技術担当"
            role: "船を最終確認した仲間"
          - name: "元サッカー部"
            role: "地上から見送った仲間"
          - name: "主人公の父"
            role: "断熱材を間接的に託した支援者"
        emotional_impact: "critical"
        emotional_detail: |
          地球で得た人、食べ物、言葉、修理部品を船へ積み、少女は二つの世界を物理的にも結びつけて出発した。地球の家と友達を残す悲しみを抱えながら、帰郷へ向けて実際に飛び立った解放の瞬間でもある。
        canonical_quotes:
          - quote: 'かんしょうざい、きれい'
            context: "父が届けた断熱材で銀色になった船体を見上げる"
            z_intensity: "medium"
            z_mode: "release"
          - quote: 'かえす'
            context: "幼なじみに、主人公を地球へ帰すと約束する"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: 'やくそく'
            context: "指切りの意味を教わり、約束として受け入れる"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: 'アインツ・ツヴァイ・トライ'
            context: "大気圏を抜けたあと、地球で作った掛け声を繰り返す"
            z_intensity: "high"
            z_mode: "release"
          - quote: 'スター'
            context: "飛ぶ前には言わなかった四つ目を、実際に宇宙へ出てから告げる"
            z_intensity: "high"
            z_mode: "release"
        z_relevance: |
          発射時は「アインツ／ツヴァイ／トライ」までで船が飛び、「スター」は飛んだ後に置かれる。この順序が題名と関係の完成を担うため崩さない。「かえす」は主人公を物のように返す意味ではなく、幼なじみから命を預かる約束である。
        character_state_change:
          before: "地球の工場で別れを待つ帰還者"
          after: "地球の記憶と主人公を乗せ、母星へ向けて飛び立った同乗者"
          permanent: true
        tags: ["launch", "farewell", "promise", "iconic_scene", "countdown"]

      - episode_id: "seventh_sector_crossing"
        timeline: "main"
        chronological_order: 18
        title: "第七宙域で握った手"
        source_episode: "stargazer_ep23.md / 第23話「第七宙域」"
        summary: |
          航行中、少女は地球で自分が質問を続けたときとは逆に、宇宙を見て質問する主人公を楽しそうに見守った。焼き芋を包んだ断熱材を、主人公の父と幼なじみの二人が一緒になったものとして大切に残す。
          通信不能の第七宙域で破片が船を損傷すると、修理へ向かう主人公を強く止めたが、三十分で戻るという約束を受け入れて数え続けた。自身の容体も悪化するなか、主人公と手を握り、母星語の歌と掛け声を共に唱える。最後にKlaudeを呼ぶと、管理系は応答した。
        participants:
          - name: "主人公"
            role: "手を握り、危険な航路を共に進む操縦者"
          - name: "Klaude Oops 11.3"
            role: "判断を操縦者へ委ね、呼びかけへ応答した管理系"
          - name: "主人公の父"
            role: "断熱材を通じて船を守った不在の支援者"
          - name: "幼なじみ"
            role: "焼き芋と包みを通じて同行する不在の仲間"
        emotional_impact: "critical"
        emotional_detail: |
          少女は自分の帰還が近づくほど衰弱しながら、主人公の安全を恐れ続けた。墜落時には届かなかった「halda」の願いが、この航行では実際に握られた手として成立する。母星語と地球で作った掛け声も一つにつながった。
        canonical_quotes:
          - quote: 'みてた。あなたを'
            context: "主人公が宇宙について質問し続ける間、何を見ていたのか答える"
            z_intensity: "high"
            z_mode: "nurture"
          - quote: 'ふたつ、いっしょ'
            context: "父の断熱材と幼なじみの焼き芋の包みを、二人の贈り物として抱える"
            z_intensity: "high"
            z_mode: "nurture"
          - quote: 'かぞえてた'
            context: "船外修理へ出た主人公の帰還まで、時間を数え続けていたと答える"
            z_intensity: "high"
            z_mode: "concern"
          - quote: 'それでも、いく?'
            context: "主人公が恐怖を認めながら危険な出力上昇を選ぶことを確認する"
            z_intensity: "high"
            z_mode: "concern"
          - quote: 'halda, halda, halda mér'
            context: "主人公と手を握り、母星語の歌を共に唱える"
            z_intensity: "high"
            z_mode: "release"
          - quote: 'KLAUDE'
            context: "歌と掛け声の最後に船舶管理系を呼び、初めて明示的な応答を受ける"
            z_intensity: "high"
            z_mode: "release"
        z_relevance: |
          母星語の綴り、アクセント、大小文字を維持する。「halda, halda, halda mér」は後に「掴んで、わたしを」と読めるため、初回の「halda」と対応させる。「KLAUDE」への「はい」は、Episode 0から続く呼びかけと応答の関係を完結させる。
        character_state_change:
          before: "主人公に守られながら母星へ向かう、衰弱した同乗者"
          after: "危険と恐怖を主人公と共有し、実際に手を握られたまま故郷目前まで到達する"
          permanent: true
        tags: ["space_travel", "danger", "held_hand", "mother_tongue", "mutual_care"]

      - episode_id: "homeworld_arrival"
        timeline: "main"
        chronological_order: 19
        title: "星の中の海へ帰る"
        source_episode: "stargazer_ep24.md / 第24話「Stargazer」"
        summary: |
          少女は地球よりも青い母星を窓越しに確認し、主人公の支えを受けて着陸した。故郷の白い床へ両足をつけた瞬間、その場にしゃがみ込み、初めて声を出して泣いた。感情が安堵か悲しみかは説明されない。
          母星の人々と医療班に迎えられ、担架で治療施設へ運ばれる。主人公にきちんと治すよう言われると応じ、今度は主人公自身が地球へきちんと帰るよう繰り返した。二人はそこで別れた。
        participants:
          - name: "主人公"
            role: "故郷まで送り届け、帰還を約束した相手"
          - name: "母星で迎えた人物"
            role: "少女を支え、主人公へ感謝した母星人"
          - name: "母星の医療班"
            role: "少女を治療へ運んだ人々"
          - name: "翻訳機"
            role: "主人公と母星側の会話をつないだ装置"
        emotional_impact: "critical"
        emotional_detail: |
          少女は望み続けた故郷へ到着したが、身体は自力で歩き続けられないほど弱っていた。帰還の達成、地球との別離、治療結果への不確実さが同時に存在する。主人公の帰還を求めることで、幼なじみとの約束も果たそうとした。
        canonical_quotes:
          - quote: '……ありがと'
            context: "タラップを降りる際、ふらついた身体を主人公に支えられる"
            z_intensity: "high"
            z_mode: "release"
          - quote: 'なおす'
            context: "主人公から身体をちゃんと治すよう言われ、約束する"
            z_intensity: "high"
            z_mode: "resolve"
          - quote: 'あなたも'
            context: "自分だけでなく主人公にも果たすべき帰還があると返す"
            z_intensity: "high"
            z_mode: "nurture"
          - quote: 'ちゃんと、かえって'
            context: "担架で運ばれる直前、主人公へ地球への無事な帰還を求める"
            z_intensity: "high"
            z_mode: "nurture"
        z_relevance: |
          声を出して泣く理由を安堵だけ、悲嘆だけに固定しない。「ちゃんと」は主人公が少女へ使った語をそのまま返す相互の約束であり、幼なじみとの「かえす」にもつながる。通常の別れの挨拶を補わず、実務的な言葉だけが残る余白を守る。
        character_state_change:
          before: "母星目前で生命が危ぶまれる帰還者"
          after: "故郷へ到着して治療を受け始め、主人公とは離れた状態"
          permanent: true
        tags: ["homecoming", "separation", "treatment", "promise", "release"]

      - episode_id: "voice_across_fourteen_months"
        timeline: "main"
        chronological_order: 20
        title: "十四か月後の声"
        source_episode: "stargazer_epilogue.md / Epilogue「Stargazer -星図のあとで-」"
        summary: |
          主人公たちは墜落地点に受信塔を建て、母星からの通信を待ち続けた。十四か月にわたり受信記録が「なし」と続いた後、ノイズの中から周期的な信号が検出される。
          途切れた音声は、独特の発音から主人公が少女のものだと確信できる声で「聞こえる？」と問いかけた。治療の結果やその間の生活は語られないが、少女の声は二つの星の隔たりを越えて地球へ届いた。
        participants:
          - name: "主人公"
            role: "十四か月待ち続け、通信へ応答した相手"
          - name: "技術担当"
            role: "受信塔の建設を提案した仲間"
          - name: "幼なじみ"
            role: "受信塔建設と待機を支えた仲間"
          - name: "元サッカー部"
            role: "受信塔建設に参加した仲間"
        emotional_impact: "critical"
        emotional_detail: |
          母星到着後の生死や回復が分からない長い沈黙を破り、少女自身から接続を確かめる声が届いた。完全な回復は確認できないものの、関係が別れで閉じなかったことが初めて証明された。
        canonical_quotes:
          - quote: '――……こえる?'
            context: "ノイズに欠けながら最初に受信された、少女と強く推定される音声"
            z_intensity: "high"
            z_mode: "release"
          - quote: '聞こえる?'
            context: "信号が明瞭になり、主人公が少女の声だと確信する問い"
            z_intensity: "high"
            z_mode: "release"
        z_relevance: |
          通信の欠落した最初の形と、明瞭になった二回目を分ける。短い「聞こえる？」は単なる通信確認であると同時に、翻訳、観測、応答を積み重ねた全編の帰結である。治癒済みなど本文にない情報は補わない。
        character_state_change:
          before: "母星で治療中としか分からず、地球とは十四か月連絡がない"
          after: "自分の声を地球へ届け、主人公との接続を再開する"
          permanent: true
        tags: ["reconnection", "signal", "voice", "hope", "epilogue"]

arcs:
  - arc_id: "lost_and_found_home"
    title: "失われた故郷と二つの家"
    episodes:
      - "departure_without_destination"
      - "return_wish_and_missing_coordinates"
      - "factory_called_home"
      - "home_coordinate_restored"
      - "aquarium_before_departure"
      - "farewell_launch"
      - "homeworld_arrival"
      - "voice_across_fourteen_months"
    theme: "母港座標を失った少女が、地球にも家と呼べる場所を得たうえで故郷へ帰り、二つの星を通信で結び直す過程。"
    character_growth: |
      当初の少女にとって帰る場所は失われた座標だった。共同作業場を「いえ」と呼び、地球を離れたくないと認めたことで、帰郷は一方の世界を捨てる行為ではなくなる。最終的に母星へ戻っても、地球との関係は声によって継続する。
    z_translation_note: |
      「かえる」は帰郷、主人公の地球帰還、幼なじみへ主人公を返す約束という複数の向きを持つ。「いえ」も建物だけでなく共同体を指すため、各場面の方向と対象を明示しつつ語の反復を保つ。

  - arc_id: "different_without_becoming_same"
    title: "同じにならずに噛み合う"
    episodes:
      - "threads_between_worlds"
      - "sourness_that_remains"
      - "fish_are_friends"
      - "factory_called_home"
      - "named_summer_days"
    theme: "規格、言語、食文化、倫理が違っても、片方を消さずに接続方法を作れるという学び。"
    character_growth: |
      少女は異星船の部品、栽培方法、魚食、発音の違いを経験する。違いを誤りや優劣へ変換せず、自分の境界を守りながら他者の方法も認めるようになる。仲間側の言葉も「トライ」へ変わり、適応は双方向になる。
    z_translation_note: |
      少女の簡素な「ちがう」「おなじじゃなくて、いい」を未熟な発言として修正しない。意味の精度は高く、作品の翻訳思想を担う。文化衝突では奇異さより、線を引く場所の違いを優先する。

  - arc_id: "names_language_and_voice"
    title: "名前のない少女から届く声へ"
    episodes:
      - "return_wish_and_missing_coordinates"
      - "threads_between_worlds"
      - "named_summer_days"
      - "farewell_launch"
      - "seventh_sector_crossing"
      - "voice_across_fourteen_months"
    theme: "日本語に対応しない名前、翻訳機への依存、直接会話、日々の命名、母星語の歌、遠距離通信まで続く言語の軌跡。"
    character_growth: |
      固有名を訳せなかった少女は、覚えた日本語で意思を示し、不完全な言葉でも主人公と感情を共有する。さらに自分の音韻で共同の掛け声を変え、名前を付けて記憶を残す。最後には自分の声そのものを地球へ届ける。
    z_translation_note: |
      翻訳機の平坦で整った文、少女の短い日本語、母星語の原音を混同しない。「トライ」は誤植修正せず、母星語の綴りと発音記号も統一する。固有名が本文に音写されない事実を守り、新しい名前を創作しない。

  - arc_id: "reaching_and_holding_hands"
    title: "届かなかった手から握った手へ"
    episodes:
      - "falling_light_unreached_hand"
      - "speaking_to_father"
      - "chosen_days_not_guilt"
      - "caught_before_falling"
      - "shared_pilot_decision"
      - "seventh_sector_crossing"
      - "homeworld_arrival"
    theme: "墜落時に届かなかった手が、理解、救助、同行、航行中の接触を経て実際に互いを支える手へ変わる。"
    character_growth: |
      少女は最初、未知の主人公へ「halda」と助けを求めた。後に、届かなかった結果より伸ばした行為を覚えていると父へ伝える。病気の際には必要なものを尋ねさせ、倒れた身体を支えられ、宇宙では自ら主人公の手を握る。助けは一方向ではなくなる。
    z_translation_note: |
      「伸ばす」「届く」「掴む」「握る」の語彙を場面間で対応させる。特に「halda」の意味を初出で先取りせず、後の辞書判明と「halda mér」で感情的な意味が完成する構造を守る。

  - arc_id: "body_time_and_agency"
    title: "地球に属さない身体と、自分で選んだ時間"
    episodes:
      - "speaking_to_father"
      - "pool_and_first_chill"
      - "chosen_days_not_guilt"
      - "caught_before_falling"
      - "aquarium_before_departure"
      - "shared_pilot_decision"
      - "homeworld_arrival"
      - "voice_across_fourteen_months"
    theme: "地球を愛していても身体が環境に耐えられない少女が、病状によって選択主体を奪われることを拒み、自分の帰還と別れを選ぶ物語。"
    character_growth: |
      少女は早い段階から身体が地球のものではないと理解していた。症状が深刻化しても、楽しかった日々を主人公の罪にさせず、自分が選んだと主張する。帰りたい気持ちと離れたくない気持ち、主人公を危険にさらしたくない気持ちをすべて抱えたまま、最終的に同行を受け入れて故郷へ到達する。
    z_translation_note: |
      少女を受動的な病人や自己犠牲的な慰撫役だけにしない。「選んだ」「行く」「だめ」「帰りたい」は彼女自身の判断である。病状の深刻さと、短い日本語に宿る強い主体性を同時に表現する。