        summary: |
          主人公の父に存在を知られた少女は、自ら父の家を訪ね、半年世話になったことを謝った。地球は嫌ではないが、自分の身体はこの環境のものではないため帰ると説明する。
          父が息子について何も知らないと判断し、主人公がよく笑うこと、初対面で言葉も分からない自分へ手を伸ばしたことを伝えた。届かなかった事実ではなく、伸ばした行為を見ていたと証言し、父が息子と修理計画を信じる契機を作った。
