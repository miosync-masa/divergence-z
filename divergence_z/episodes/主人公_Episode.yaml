            z_mode: 'stable'
        z_relevance: |
          数値を淡々と読む声には、諦めと執着が同居している。後の操縦適性や航行中の異常検知は、この六年間の反復へ直接つながるため、数値表現や誤差という語を一貫させる必要がある。
