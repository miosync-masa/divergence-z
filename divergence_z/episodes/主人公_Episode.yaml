        summary: |
          丘で流星を数えていた主人公は、どの既知の分類にも収まらない光を目撃した。他人に判定を渡したくないという衝動から通報せず、墜落地点へ走り、異星の船と少女に出会った。
          少女が倒れかけたとき、主人公は考えるより先に手を伸ばした。手は届かなかったが、分類不能な相手へ自発的に動いた最初の瞬間となった。そして彼は、飛距離も時刻も記さず、その夜を経験として残した。
        participants:
          - name: '宇宙から来た少女'
            role: '運命的な遭遇相手'
          - name: 'Klaude Oops 11.3'
            role: '墜落と未知個体を記録した観測者'
        emotional_impact: 'critical'
        emotional_detail: |
          世界を分類して理解してきた主人公は、少女を宇宙人とも異常事態とも区別しきれなかった。その分類不能さが恐怖より先に手を動かし、停滞していた生き方へ最初の亀裂を入れた。
        canonical_quotes:
          - quote: '「……流れ星じゃない」'
            context: '消えずに接近してくる光を見て、既存の分類から外れたと声に出す。'
            z_intensity: 'high'
            z_mode: 'concern'
        z_relevance: |
          区別、分類、判定という語彙は主人公の認識様式を示す。この夜の届かなかった手と記録を取らなかった事実は、後の救助、操縦、haldaの意味、記録しない楽しい夜へ繰り返し接続される。
        character_state_change:
          before: '未知を分類し、数値として記録することで距離を置く観察者。'
          after: '答えがないまま未知へ走り、届かなくても手を伸ばした当事者。'
          permanent: true
        tags: ['初遭遇', '転機', '届かない手', '分類不能', '記録しない夜']

