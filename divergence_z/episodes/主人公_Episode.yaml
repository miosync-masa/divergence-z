          - name: '幼なじみ'
            role: '決断を見守る仲間'
        emotional_impact: 'critical'
        emotional_detail: |
          主人公は、幼いころ止まった宇宙への道を、夢の達成ではなく他者への責任として再び選んだ。怖さも帰れない可能性も否定せず、それでも行くと決めたことで、見るだけだった自己像を越えた。
        canonical_quotes:
          - quote: '「今から、覚えられる?」'
