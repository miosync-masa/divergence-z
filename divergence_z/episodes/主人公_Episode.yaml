            z_intensity: 'high'
            z_mode: 'resolve'
          - quote: '「めちゃくちゃこわい」'
            context: '少女に怖くないのかと訊かれ、強がらず即答する。'
            z_intensity: 'high'
            z_mode: 'concern'
          - quote: '「でも、行く」'
            context: '恐怖を認めたうえで、決断を変えない。'
            z_intensity: 'high'
            z_mode: 'resolve'
        z_relevance: |
          主人公の勇気は恐怖の欠如ではなく、恐怖を明言したあとに続く短い決断にある。めちゃくちゃこわいを弱めたり、でも行くへ英雄的な修辞を足したりせず、簡潔な対比を維持する。
        character_state_change:
          before: '少女の帰還を地上から支えるつもりでいる。'
          after: '自分の生命と帰路を賭け、少女と共に宇宙へ行く操縦者になる。'
