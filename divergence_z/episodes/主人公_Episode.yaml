      - episode_id: 'training_and_liftoff'
        timeline: 'main'
        chronological_order: 17
        title: '七冊目のノートと離陸'
        source_episode: 'stargazer_ep22.md / 第22話「アインツ、ツヴァイ、トライ。」'
        summary: |
          主人公は五日間、一日十六時間、ほとんど動かない計器を見続け、七冊目のノートへ変動を書いた。六年間の習慣を訓練へ変換し、操縦者基準へ到達した。
          出発前夜、父は追加のMLIと芋を置き、三人の仲間は工具、部品、食料、約束を託した。主人公は三人へ行ってくると告げ、通信越しにアインツ、ツヴァイ、トライと数えた。四つ目を言わないまま船が浮き、少女は宇宙へ出てからスターと続けた。
        participants:
          - name: '宇宙から来た少女'
            role: '同乗者'
          - name: 'Klaude Oops 11.3'
            role: '操縦教官と航行管理系'
          - name: '技術担当'
            role: '予備部品と帰還命令を託す仲間'
          - name: '元サッカー部'
            role: '地上から見送る仲間'
          - name: '幼なじみ'
            role: '主人公を返す約束を少女と結ぶ仲間'
          - name: '主人公の父'
            role: '追加資材を無言で託す父親'
        emotional_impact: 'critical'
        emotional_detail: |
          主人公は、過去の停滞を切り捨てず、その全てを操縦能力として携えて飛び立った。三人を地上へ残す痛みと、少女の隣に座る覚悟が同時にある離陸だった。
        canonical_quotes:
          - quote: '「……行ってくる」'
            context: '地上へ残る三人へ、出発前の挨拶をする。'
            z_intensity: 'high'
            z_mode: 'resolve'
          - quote: '「――アインツ」'
            context: '通信を開き、仲間との合言葉で出発のカウントを始める。'
            z_intensity: 'high'
            z_mode: 'release'
          - quote: '「ツヴァイ」'
            context: '地上の仲間が応じる中、二つ目を数える。'
            z_intensity: 'high'
            z_mode: 'release'
          - quote: '「トライ」'
            context: '挑戦の意味を持つ三つ目を、少女と同時に言う。'
            z_intensity: 'high'
            z_mode: 'resolve'
        z_relevance: |
          三語の表記と順序は共有記憶そのものであり、通常のドイツ語へ訂正してはならない。四つ目の沈黙、離陸後のスターという時間差が重要なので、カウントの間と反復を保持する。
        character_state_change:
          before: '訓練中の操縦者候補であり、地上の生活に属している。'
          after: '仲間の仕事と父の支援を積み、少女を母星へ運ぶ正式な操縦者として離陸する。'
          permanent: true
        tags: ['訓練', '出発', '七冊目', '合言葉', '宇宙飛行']

      - episode_id: 'seventh_sector_trial'
        timeline: 'main'
        chronological_order: 18
        title: '第七宙域で引き受けた判断'
        source_episode: 'stargazer_ep23.md / 第23話「第七宙域」'
        summary: |
          第七宙域で主人公は、許容範囲内に収まる角速度の末尾が継続して増えていることに気づいた。Klaudeが異常なしと判断した段階で違いを指摘し、見えない破片群を発見して減速を決めた。
          破片は父のMLIを三層目まで貫き、左舷推進系を損傷させた。主人公は技術担当の予備部品で修理し、悪化する少女を前に右舷へ危険な負荷をかける判断も自ら下した。彼女の冷たい手を握り、恐怖を認めながら君と行くと言い切った。
        participants:
          - name: '宇宙から来た少女'
            role: '主人公が守り、共に進む同乗者'
          - name: 'Klaude Oops 11.3'
            role: '判断材料を提示し、最終決定を操縦者へ渡す管理系'
          - name: '技術担当'
            role: '予備部品と修理知識を残した支援者'
          - name: '主人公の父'
            role: 'MLIによって遠隔的に船を守る支援者'
        emotional_impact: 'critical'
        emotional_detail: |
          訓練で得た能力が、初めて二人の生死を左右した。主人公は機械の判定を否定するのではなく、その限界を理解して情報を受け取り、危険な結果への責任を自分で引き受けた。
        canonical_quotes:
          - quote: '「うん。でも、上がってる」'
            context: 'Klaudeが許容範囲内だと告げても、数値の継続的な上昇を指摘する。'
            z_intensity: 'high'
            z_mode: 'concern'
          - quote: '「公差内なのは分かってる」'
            context: '単一時点の正常判定ではなく、変化の流れを見ていると示す。'
            z_intensity: 'high'
            z_mode: 'resolve'
          - quote: '「でも、さっきまでと違う」'
            context: '数値の絶対値ではなく、過去との差を異常の根拠にする。'
            z_intensity: 'high'
            z_mode: 'concern'
          - quote: '「――上げる」'
            context: 'Klaudeから操縦者として判断を返され、危険を承知で出力上昇を決める。'
            z_intensity: 'high'
            z_mode: 'resolve'
          - quote: '「――君と行く」'
            context: '怖くても進むのかと少女に問われ、手を握ったまま答える。'
            z_intensity: 'high'
            z_mode: 'resolve'
        z_relevance: |
          公差内、違う、上がっているという技術的な短文が、主人公の全経験を集約している。君という呼び方は普段より直接的で親密なため、最終決意の重みを保ち、勇ましい標語へ言い換えないこと。
        character_state_change:
          before: '訓練を終えたが、実航行で重大判断を下したことのない操縦者。'
          after: '機械の限界を補い、修理と危険な航行判断を自分の責任で遂行する操縦者。'
          permanent: true
        tags: ['第七宙域', '異常検知', '操縦', '手を握る', '決断']

      - episode_id: 'homeworld_farewell_and_empty_seat'
        timeline: 'main'
        chronological_order: 19
        title: '母星到着と空いた隣席'
        source_episode: 'stargazer_ep24.md / 第24話「Stargazer」'
        summary: |
          主人公は少女を青い母星へ届け、ふらつく身体を支えてタラップを降りた。少女が故郷の床へ両足をつき、初めて声を上げて泣く姿を、何も言わずそばで見守った。
          医療班に運ばれる少女を呼び止めたものの、主人公が言えたのは互いにちゃんと治し、ちゃんと帰るという約束だった。治療前の短い面会を勧められても、別れを長引かせる言葉を恐れて断った。補給完了後、空いた隣席を見ながら一人で地球への航路へ入った。
        participants:
          - name: '宇宙から来た少女'
            role: '送り届けた相手'
          - name: '母星で迎えた人物'
            role: '主人公へ感謝し、容体を知らせる人物'
          - name: '母星の医療班'
            role: '少女を治療へ運ぶ人々'
          - name: 'Klaude Oops 11.3'
            role: '帰還航路を設定する管理系'
        emotional_impact: 'critical'
        emotional_detail: |
          約束は達成されたが、少女の治癒も再会も保証されなかった。主人公は彼女を帰すために来た以上、自分も帰る責任を守ったが、隣席の不在によって初めて喪失の形を直視した。
        canonical_quotes:
          - quote: '「……ちゃんと、治せよ」'
            context: '医療班に運ばれる少女を呼び止め、最後に治療を約束させる。'
            z_intensity: 'high'
            z_mode: 'nurture'
          - quote: '「帰る」'
            context: '少女から自分も地球へ帰るよう求められ、約束する。'
            z_intensity: 'high'
            z_mode: 'resolve'
          - quote: '「……いえ」'
            context: '出発前に少女と短時間会うかと勧められ、迷った末に断る。'
            z_intensity: 'high'
            z_mode: 'grief'
          - quote: '「大丈夫です」'
            context: '会わない決断を母星の人物へ伝えるが、自分自身へも言い聞かせている。'
            z_intensity: 'high'
            z_mode: 'grief'
          - quote: '「……知ってる」'
            context: 'Klaudeから同乗者はいないと告げられ、空席を見て答える。'
            z_intensity: 'high'
            z_mode: 'grief'
        z_relevance: |
          ちゃんとという幼い反復は、治療と帰還を互いに託す二人の別れの言葉である。大丈夫ですは実際の平静を意味せず、知ってるも情報への応答ではなく不在への痛みなので、字面以上の抑制を保つ。
        character_state_change:
          before: '少女と並んで同じ目的地へ進む操縦者。'
          after: '約束を果たして少女を残し、自分の帰還を一人で引き受ける操縦者。'
          permanent: true
        tags: ['母星到着', '別れ', '空席', '約束達成', '単独帰還']

      - episode_id: 'fourteen_month_signal'
        timeline: 'main'
        chronological_order: 20
        title: '届かなかった言葉と十四か月後の声'
        source_episode: 'stargazer_epilogue.md / Epilogue「Stargazer -星図のあとで-」'
        summary: |
          単独帰還中、主人公は自分が少女へ話すために宇宙を見ていたことへ遅れて気づいた。地球へ戻った後には、最初の夜のhaldaが掴むという意味だったと知り、あのとき少女が掴んでと求めていたことも理解した。
          主人公は仲間のもとへ帰還し、少女から託された魚を世話し、父の打ち上げ連絡には初めて消さずに見ると返した。四人で受信塔を建て、十四か月にわたって受信状況なしと記録し続けた末、少女の声を検出した。用意していたはずの言葉は出ず、主人公は風邪を心配する冗談で応答した。
        participants:
          - name: '宇宙から来た少女'
            role: '遠距離通信で再び声を届ける相手'
          - name: '技術担当'
            role: '受信塔を発案し建設する仲間'
          - name: '元サッカー部'
            role: '主人公の帰還を迎え塔を建てる仲間'
          - name: '幼なじみ'
            role: '主人公の帰還を迎え待機を見守る仲間'
          - name: '主人公の父'
            role: '主人公が初めて文章で応答する父親'
          - name: '名前のついたメダカ'
            role: '少女との約束を日常につなぐ存在'
        emotional_impact: 'critical'
        emotional_detail: |
          主人公は再び見る人になったが、今度は閉じた観察者ではなく、誰かへ届けるために見て記録する人になった。十四か月の不在を耐えた末の応答は、告白ではなく日常的な心配であり、それゆえ二人の関係が途切れていないことを示した。
        canonical_quotes:
          - quote: '「うん。ただいま」'
            context: '十三日ぶりに地球へ帰り、元サッカー部の二度目のおかえりへ応じる。'
            z_intensity: 'high'
            z_mode: 'release'
          - quote: '『見る』'
            context: '父から届いた次の打ち上げ予定へ、今度は消さずに送った返信。'
            z_intensity: 'medium'
            z_mode: 'release'
          - quote: '「――また、風邪引くぞ?」'
            context: '十四か月ぶりに聞こえた少女の声へ、最初に返した言葉。'
            z_intensity: 'high'
            z_mode: 'nurture'
        z_relevance: |
          最終の言葉は軽口ではなく、少女の病気、別れ、再会への安堵を圧縮した主人公らしい気遣いである。感動的な告白へ置き換えず、少しぶっきらぼうな日常語のまま再接続の深さを残すこと。
        character_state_change:
          before: '少女の不在を抱え、届く保証のない信号を待つ状態。'
          after: '観測と記録を他者へ届ける行為として続け、少女との通信を再び結ぶ状態。'
          permanent: true
        tags: ['帰還', '待機', '通信', '再会', 'Stargazer']

arcs:
  - arc_id: 'watcher_to_pilot'
    title: '見るだけの少年から、判断する操縦者へ'
    episodes:
      - 'childhood_dream_stops'
      - 'six_years_of_measurement'
      - 'watcher_becomes_doer'
      - 'factory_home_and_unseen_pipe'
      - 'illness_guilt_and_water'
      - 'choosing_to_pilot'
      - 'training_and_liftoff'
      - 'seventh_sector_trial'
    theme: '喪失によって観察へ閉じこもった主人公が、観測能力を他者を救う行動と責任ある判断へ変える過程。'
    character_growth: |
      当初の観測は、失敗や喪失へ関与しないための防御だった。少女との修理、病気、操縦訓練を経て、主人公は見ることを判断材料として使い、結果の責任まで引き受けるようになる。
    z_translation_note: |
      初期と後期で発話の短さは共通するが、初期は閉鎖と諦め、後期は集中と覚悟を示す。数値、誤差、見るという反復語を一貫させ、変化を語調の強さだけで表現しないこと。

  - arc_id: 'reaching_and_holding'
    title: '届かなかった手から、握り続ける手へ'
    episodes:
      - 'first_contact_unrecorded_night'
      - 'talking_without_translation'
      - 'illness_guilt_and_water'
      - 'eight_meter_leap'
      - 'aquarium_last_day'
      - 'seventh_sector_trial'
      - 'homeworld_farewell_and_empty_seat'
      - 'fourteen_month_signal'
    theme: '最初の夜に届かなかった手が、現在の必要へ応じる手、倒れる少女を支える手、航行中に握り続ける手へ変わる。'
    character_growth: |
      主人公は届かなかった行為を失敗だと思い続けたが、少女は手を伸ばした事実を見ていた。後にhaldaの意味を知ることで、その最初の失敗も二人の関係の始点として再解釈される。
    z_translation_note: |
      手を伸ばす、届く、掴む、支える、握るという身体語彙は同じモチーフに属する。haldaとhalda mérの訳は、最初の遭遇と単独帰還後の理解が接続するよう統一すること。

  - arc_id: 'different_but_connected'
    title: '同じにならず、間をつなぐ'
    episodes:
      - 'promise_and_first_bolt'
      - 'talking_without_translation'
      - 'earth_seen_anew'
      - 'naming_the_shared_summer'
      - 'aquarium_last_day'
      - 'training_and_liftoff'
      - 'fourteen_month_signal'
    theme: '規格、言語、文化、発音、故郷が違う二人が、違いを消さずに接続方法を作る物語。'
    character_growth: |
      主人公は当初、通じるか通じないかを二分していた。少女との経験を通じ、ボルトとナットの間、拙い日本語、改変された掛け声、遠距離通信のノイズの中にも接続を見いだすようになる。
    z_translation_note: |
      少女の不完全な日本語を過度に流暢にせず、主人公の短い応答との噛み合いを残す。アインツ・ツヴァイ・トライや固有の言い間違いは、訂正対象ではなく二人の共有語として扱う。

  - arc_id: 'errors_point_to_truth'
    title: '誤差が真実を指す'
    episodes:
      - 'six_years_of_measurement'
      - 'factory_home_and_unseen_pipe'
      - 'illness_guilt_and_water'
      - 'residuals_restore_home'
      - 'choosing_to_pilot'
      - 'seventh_sector_trial'
    theme: '意味がないと見なされた微小差、リスト外のもの、基準からの差分が、母星と航路上の危険を発見する手掛かりになる。'
    character_growth: |
      主人公は誤差を記録するだけの少年から、差の継続や向きを読み、その背後にある原因を考える操縦者へ成長した。単一の正常判定より、時間を通じた変化と未登録の可能性を信頼するようになる。
    z_translation_note: |
      誤差、公差、残差、変動、差分、異常は役割が異なるため混同しないこと。技術用語は主人公の感情的成長を支える反復でもあり、場面ごとに別表現へ散らさない。

  - arc_id: 'father_silent_support'
    title: '言葉にしない父子の支援'
    episodes:
      - 'six_years_of_measurement'
      - 'factory_home_and_unseen_pipe'
      - 'father_believes_and_sends_mli'
      - 'training_and_liftoff'
      - 'seventh_sector_trial'
      - 'fourteen_month_signal'
    theme: '疎遠だった父子が、工場、計画書、芋、MLI、打ち上げ連絡を介して互いの仕事と決意を認める。'
    character_growth: |
      主人公は父の連絡へ文章を送れず、支援を受け取ることにも抵抗していた。父の資材が実際に船と命を守った後、主人公は打ち上げを見ると明言できるようになる。
    z_translation_note: |
      父子の情愛は説明されず、短い命令、物品、スタンプ、既読で表現される。台詞へ感情語を補わず、怪我をするな、見るといった簡潔な言葉に蓄積された重みを残す。