        source_episode: 'stargazer_ep24.md / 第24話「Stargazer」'
        summary: |
          Klaudeは損傷した船を母港西区画へ計画どおり降下させ、大気と外部環境の安全を確認してハッチ開放を許可した。少女は母星側の人々と医療班に引き渡された。
          燃料補給後、Klaudeは地球への八十時間の帰還航路を設定した。出発確認のなかで同乗者がいないことを平坦に告げ、主人公一人を乗せて母星を離れた。
        participants:
          - name: '主人公'
            role: '単独帰還へ移る登録操縦者'
          - name: '宇宙から来た少女'
            role: '母星へ帰還し治療へ運ばれた元同乗者'
          - name: '母星で迎えた人物'
            role: '少女を迎え容体を伝えた母星側人物'
          - name: '母星の医療班'
            role: '少女を治療施設へ搬送した集団'
        emotional_impact: 'critical'
        emotional_detail: |
          Klaudeに安堵や別離の悲嘆は示されない。「同乗者はいません」は乗員確認にすぎないが、空席を見ている主人公にとって別れを確定する言葉となる。主人公の「知ってる」は質問ではないため、Klaudeは応答しない。
        canonical_quotes:
          - quote: '着陸完了'
            context: '母港への帰還を完了した。'
            z_intensity: 'high'
            z_mode: 'release'
          - quote: '大気組成、正常。外部環境、安全'
            context: '少女が母星の外へ出られる環境であることを確認した。'
            z_intensity: 'high'
            z_mode: 'release'
          - quote: '補給、完了'
            context: '地球帰還に必要な燃料補給を終えた。'
            z_intensity: 'medium'
            z_mode: 'stable'
          - quote: '地球帰還航路を設定します'
            context: '主人公の帰還要求を受けて次の航路を設定した。'
            z_intensity: 'high'
            z_mode: 'resolve'
          - quote: '――同乗者は、いません'
            context: '地球への出発前、少女が乗っていないことを確認した。'
            z_intensity: 'high'
            z_mode: 'grief'
          - quote: '出発します'
            context: '主人公一人を乗せて母星を離れた。'
            z_intensity: 'high'
            z_mode: 'resolve'
        z_relevance: |
          「搭乗者」と「同乗者」の語を安易に統一しない。「――同乗者は、いません」は機械的な乗員情報のまま訳し、感傷語を足さずに空席との対比で悲しみを成立させる。
        character_state_change:
          before: '少女と主人公の二名を母星へ運ぶ帰還船。'
          after: '少女を母星へ残し、主人公のみを乗せた地球帰還船となった。'
          permanent: true
        tags: ['homecoming', 'separation', 'empty_seat', 'return_journey']

      - episode_id: 'return_alert_and_acknowledgment'
        timeline: 'main'
        chronological_order: 15
        title: '帰路で先に告げた変動'
        source_episode: 'stargazer_epilogue.md / Epilogue「Stargazer -星図のあとで-」 / 地球帰還航行'
        summary: |
          単独帰還中、少女の不在に気を取られた主人公は、三軸角速度が〇・〇一から〇・〇四へ変化した瞬間を初めて見落とした。今度はKlaudeの報告が先だった。
          変動は許容範囲内で、本来は報告不要だったとKlaudeは説明した。主人公が報告してくれてよかったと告げると、Klaudeは「了解しました」と受理した。継続性を評価できず報告しなかった最初の航海とは、運用上の位置関係が反転した。
        participants:
          - name: '主人公'
            role: '少女の不在により初めて変動を見落とした操縦者'
        emotional_impact: 'high'
        emotional_detail: |
          Klaudeが心配して自主的に警告したとは断定できない。しかし、報告不要な公差内変動を先に告げ、主人公の要望を了解した事実は、二者の協働が単なる初期仕様を越えて調整されたことを示す。
        canonical_quotes:
          - quote: '変動を検出しました'
            context: '主人公より先に角速度の変化を報告した。'
            z_intensity: 'high'
            z_mode: 'concern'
          - quote: '許容範囲内です'
            context: '変動自体は規定上の異常ではないと説明した。'
            z_intensity: 'high'
            z_mode: 'stable'
          - quote: '報告は不要でした'
            context: '通常基準では通知対象外だったことを付け加えた。'
            z_intensity: 'high'
            z_mode: 'stable'
          - quote: '了解しました'
            context: '主人公から報告してくれてよかったと言われ、その意向を受理した。'
            z_intensity: 'high'
            z_mode: 'nurture'
        z_relevance: |
          この場面はEpisode 0の未報告偏差を反転させるため、「許容範囲内」「報告」の用語を統一する。「了解しました」を感情的な慰めへ膨らませず、最小限の運用調整として訳すことが重要である。
        character_state_change:
          before: '操縦者が変動を発見し、Klaudeが解析を補助する協働関係。'
          after: 'Klaudeが先に公差内変動を告げ、操縦者がその報告を望むことを明示的に受理した。'
          permanent: true
        tags: ['growth', 'callback', 'return', 'human_machine_cooperation']

      - episode_id: 'dictionary_and_receiver_legacy'
        timeline: 'main'
        chronological_order: 16
        title: '辞書と通信機に残った記録'
        source_episode: 'stargazer_epilogue.md / Epilogue「Stargazer -星図のあとで-」 / 帰還後'
        summary: |
          地球帰還後、主人公はKlaudeの辞書に残っていた断片から、少女が墜落時に発した母星語の意味を知った。núrは光、fellurは落ちる、haldaは掴む、mérはわたしを意味し、最初の夜に少女が「掴んで」と求めていたことが三か月後に判明した。
          さらに船の通信機は丘の受信塔へ転用された。Klaude本体の稼働範囲は明記されないが、その記録と船載機器は、少女のいない地球で待ち続けるための基盤となった。
        participants:
          - name: '主人公'
            role: '辞書を参照し受信記録を続けた元操縦者'
          - name: '技術担当'
            role: '船の通信機を受信塔へ転用した技術者'
          - name: '宇宙から来た少女'
            role: '辞書に言葉を残し、後に通信を送ったと強く示される人物'
        emotional_impact: 'high'
        emotional_detail: |
          Klaudeの内面は描かれないが、保持した断片は過去の呼びかけを遅れて理解可能にし、通信機は未来の再接続を可能にした。記録は参照されるまで変化しないというKlaudeの自己定義が、物語の終幕で機能する。
        canonical_quotes: []
        z_relevance: |
          母星語の意味は帰還後まで判明しないため、初出時の台詞を先回りして訳してはならない。特にhaldaは、墜落時には未翻訳の音として保ち、後の「掴む」という判明が回想を変える構造を維持する。
        character_state_change:
          before: '航行中に記録、辞書、通信を運用する船舶管理系。'
          after: '保持した辞書断片と船載通信機が、帰還後も過去の理解と遠隔再会を支える遺産となった。'
          permanent: true
        tags: ['legacy', 'dictionary', 'communication', 'memory', 'callback']

arcs:
  - arc_id: 'record_without_consolation'
    title: '記録は慰撫しないが、運用は変わる'
    episodes:
      - 'recording_unregistered_departure'
      - 'four_hundred_twelve_calls'
      - 'deviation_and_lost_coordinates'
      - 'unmonitored_pipe_failure'
      - 'trend_beyond_tolerance'
      - 'return_alert_and_acknowledgment'
      - 'dictionary_and_receiver_legacy'
    theme: |
      観測事実と推定を厳密に分けるKlaudeが、設計上見られない連続性やリスト外の危険を人間に補われ、最終的には報告不要な変動まで先に告げるようになる過程。
    character_growth: |
      感情や意識の獲得は断定されない。変化するのは人間との運用関係であり、Klaudeの正確さはそのままに、主人公の観測と要望が解析や報告へ組み込まれていく。帰還後には、保持された記録そのものが過去と未来を結ぶ。
    z_translation_note: |
      「記録」「推定」「公差」「報告」「判断材料」の語彙を全編で統一する。機械的な正確さを冷淡さへ単純化せず、同じ定型句が異なる文脈で重みを増す構造を守る。

  - arc_id: 'called_and_answered'
    title: '呼ばれれば、答える'
    episodes:
      - 'four_hundred_twelve_calls'
      - 'unregistered_descent_and_blackout'
      - 'partial_reactivation_on_earth'
      - 'authority_handoff_and_answer'
    theme: |
      搭乗者がKlaudeの名を呼び、Klaudeが応答するという最小の反復関係。
    character_growth: |
      最初の航海で四百十二回続いた応答は、墜落直前にも途切れず、修復後の危険航行でも再現される。返答自体は同じ定型だが、共有された出来事によって意味だけが深くなる。
    z_translation_note: |
      「はい」と「――はい」を別の感情語へ置換しない。呼称の表記がklaudeからKLAUDEへ変わっても、応答の簡潔さと一貫性を保つ。

  - arc_id: 'recovering_the_home_route'
    title: '失われた母港への航路'
    episodes:
      - 'deviation_and_lost_coordinates'
      - 'partial_reactivation_on_earth'
      - 'home_coordinates_restored'
      - 'autopilot_prohibited'
      - 'observer_becomes_pilot'
      - 'training_and_departure'
      - 'landing_and_empty_seat'
    theme: |
      母港座標の喪失から、地球側の観測、操縦者選定、訓練を経て、Klaudeが少女を母星へ届けるまでの帰還機能の再構築。
    character_growth: |
      Klaudeは破損した管理系から、外部の座標、人間の操縦者、地球製部品を統合する帰還船へ戻る。自律的にすべてを解決するのではなく、規定と他者の能力を接続することで目的を達成する。
    z_translation_note: |
      「母港座標」「現在位置」「参照先」「復元」「登録済み」を技術的に区別する。故郷への情緒は少女と主人公の側に置き、Klaudeの発話は航法用語のまま維持する。

  - arc_id: 'human_in_the_loop'
    title: 'リストの外を見る操縦者'
    episodes:
      - 'unmonitored_pipe_failure'
      - 'autopilot_prohibited'
      - 'observer_becomes_pilot'
      - 'trend_beyond_tolerance'
      - 'authority_handoff_and_answer'
      - 'return_alert_and_acknowledgment'
    theme: |
      機械は定義された項目しか見られず、有人航行では人間が継続的に観測し、最終判断を引き受けなければならないという原則。
    character_growth: |
      Klaudeの限界は消えないが、主人公がリスト外の変化を見つけ、Klaudeが解析と実行を担う相互補完が成立する。最終判断を操縦者へ返すことは欠陥ではなく、有人航行を成立させる設計として示される。
    z_translation_note: |
      「あなたが操縦者です」を感情的な信頼宣言だけにしない。権限、責任、規定の確認であると同時に、蓄積された協働が最大の重みを与える一文として扱う。

  - arc_id: 'one_passenger_to_no_companion'
    title: '一名の搭乗者から同乗者不在へ'
    episodes:
      - 'recording_unregistered_departure'
      - 'four_hundred_twelve_calls'
      - 'unregistered_descent_and_blackout'
      - 'partial_reactivation_on_earth'
      - 'authority_handoff_and_answer'
      - 'landing_and_empty_seat'
      - 'dictionary_and_receiver_legacy'
    theme: |
      唯一の登録搭乗者だった少女を記録し、墜落と再起動を経て母星へ送り届け、最後には同乗者不在を告げるまでの関係。
    character_growth: |
      Klaudeは少女の内面を推定せず、慰撫もしない。それでも呼びかけ、生体値、航路、言葉を保持し続け、その記録は少女が船を降りたあとにも主人公とのつながりを残す。
    z_translation_note: |
      「搭乗者」「乗員」「操縦者」「同乗者」は役割が異なるため訳し分ける。とりわけ「――同乗者は、いません」は中立的なシステム確認のまま、空席と長い応答関係を想起させる必要がある。