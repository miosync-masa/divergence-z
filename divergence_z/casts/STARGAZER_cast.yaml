work: "STARGAZER ≠consciousness"

narration:
  - files: ["stargazer_ep00.md"]
    narrator: "Klaude Oops 11.3"
    style: "一人称の記録文体"
    notes: "地の文の「当機」は船舶管理系 Klaude Oops 11.3。観測事実と推定を区別して記録する。記録中の「搭乗者」は宇宙から来た少女、「未知個体」「当該個体」は墜落地点へ接近した主人公と推定される。"
  - files: ["stargazer_ep01.md", "stargazer_ep02.md", "stargazer_ep03.md", "stargazer_ep04.md", "stargazer_ep05.md", "stargazer_ep06.md", "stargazer_ep07.md", "stargazer_ep09.md", "stargazer_ep10.md", "stargazer_ep11.md", "stargazer_ep12.md", "stargazer_ep13.md", "stargazer_ep14.md", "stargazer_ep15.md", "stargazer_ep16.md", "stargazer_ep17.md", "stargazer_ep18.md", "stargazer_ep20.md", "stargazer_ep21.md", "stargazer_ep22.md", "stargazer_ep23.md", "stargazer_ep24.md", "stargazer_epilogue.md"]
    narrator: "主人公"
    style: "一人称「僕」"
    notes: "星と数値を観察する高校生の回想的な一人称。第23話以降は宇宙船の操縦者として語り、Epilogueでは単独帰還後までを回想する。"
  - files: ["stargazer_ep08.md"]
    narrator: "幼なじみ"
    style: "一人称「わたし」"
    notes: "主人公を「あいつ」、宇宙から来た少女を「あの子」と呼ぶ。主人公への長年の思いと、少女への複雑な感情を内面から語る。"
  - files: ["stargazer_ep19.md"]
    narrator: "元サッカー部"
    style: "一人称「俺」"
    notes: "動きや身体の向きを読む視点で語る。主人公を「主人公」「あいつ」、幼なじみを「あいつ」、少女を「あの子」と呼ぶため、文脈による区別が必要。"
  - files: ["stargazer_epilogue.md"]
    narrator: "uncertain_observers"
    style: "末尾のみ話者不明の観測会話"
    notes: "末尾の斜体部分「未確認光点を観測」「識別名は？」などは、主人公の一人称叙述とは別の無記名会話。話者の人数・正体・時点はいずれも不明。"

