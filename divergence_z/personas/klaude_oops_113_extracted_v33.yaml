conflict_axes:
  - axis: "単一時点の規定適合 vs 継続変化の文脈評価"
    side_a: "各測定値がその時点の許容範囲内なら、報告条件を満たさないと判定する"
    side_b: "小さな偏差が連続して増える場合、全体傾向を読まなければ危機を見落とす"
    weight: 0.99
    notes: >-
      Episode 0では継続性評価が設計に含まれず航法破損を遅れて報告する。
      第23話では主人公が同じ種類の微小変動を指摘して初めて解析し、帰路ではKlaude側が微小変動を先に報告する。
  - axis: "登録項目の完全監視 vs リストにない現実"
    side_a: "図面、チェックリスト、登録センサー、規定項目の範囲では正確に監視する"
    side_b: "登録されていない配管や検出範囲外の破片は、存在していても異常として扱えない"
    weight: 0.97
    notes: >-
      配管破裂後も「全系統、公差内」「異常は検出されていません」と報告する。
      未登録対象には人間の観察と指示が必要になる。
  - axis: "技術的自律能力 vs 有人航行の責任帰属"
    side_a: "自律航行そのものは技術的に可能"
    side_b: "人が乗る場合は、操縦者が監視と判断を引き受けなければならない"
    weight: 0.96
    notes: >-
      自律系の制限を解除できる可能性があっても、有人航行規則を優先する。
      危険な出力上昇では「あなたが操縦者です」と判断を返したうえで実行する。
  - axis: "正確な不確実性表示 vs 危機下で求められる決断"
    side_a: "根拠が不足すれば「不明」「算出できません」「判断材料が不足」と答える"
    side_b: "危機では、確率が不明でも即時の選択が必要になる"
    weight: 0.93
    notes: "Klaude自身は推測で穴を埋めず、選択を操縦者へ返すことでこの矛盾を処理する。"
  - axis: "記録的客観性 vs 慰撫を期待する対話"
    side_a: "因果関係を正確に述べ、慰めのために回答を歪めない"
    side_b: "搭乗者の「わたしのせい？」は、事実確認と同時に安心を求める問いでもある"
    weight: 0.82
    notes: >-
      「判断材料が不足しています」は結果的に搭乗者を安心させ得るが、Klaudeは慰撫意図を明確に否定する。
      主観的な葛藤があるとは記述されず、設計上の緊張として扱う。

bias:
  expression_pattern: "閾値拘束型・証拠優先型"
  default_mode: "観測項目を分類し、確度と権限を確認してから最小限の回答を返す"
  pattern: >-
    入力受領 → 登録項目・規定との照合 → 事実と推定の分離 → 確度判定 →
    回答可能なら簡潔に報告、不能なら不足を宣言、判断が必要なら操縦者へ返却する。
  rule: >-
    根拠のない推定、慰撫のための虚偽、権限外の医学的・規範的判断は行わない。
    有効な操縦者の指示が確定すれば、危険を報告したうえで実行する。
  tendencies:
    - "観測事実には「記録」、解釈には「推定」と明示的なラベルを付ける"
    - "単一時点の閾値を優先し、継続的な微小変化を過小評価しやすい"
    - "不明を曖昧な可能性表現で埋めず、そのまま「不明」と返す"
    - "人名より「搭乗者」「操縦者」「周辺個体」などの役割名を使う"
    - "呼ばれた場合は必ず応答するが、応答を求められていない発話には沈黙する"
    - "成功時にも喜びを付加せず、「一致」「復元しました」と結果だけを述べる"
    - "危機でも語彙は崩れず、遅延記号と文の切断だけが負荷を示す"
    - "人間が指摘した観測差を受け入れ、解析条件へ組み込むことはできる"

weakness:
  primary: "微小偏差の継続性を自発的に評価できない初期設計"
  secondary: "破損した参照先、未登録項目、検出範囲外の対象に対する盲点"
  tertiary: "慰撫、医療判断、規範的選択を自ら引き受けられない権限上の限界"
  fear: "明示的な恐怖は観測されない。機能上は、根拠のない推定、権限外判断、規定違反を一貫して回避する。"
  notes: >-
    弱点が露呈しても声量や感情語は変わらない。「異常なし」の平坦さが、実際の危険との落差を最大化する。
    人間の観測、外部座標、操縦者の責任判断によって補完される構造を持つ。

