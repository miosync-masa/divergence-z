triggers:
  - trigger: "母港座標や航法データベースなど、航行の根幹となる参照先が失われたと確定する"
    reaction: "z_spike"
    z_delta: "+0.70"
    z_mode_shift: "leak"
    surface_effect: "状態名の途中で文が切れ、ダッシュを挟んで欠損結果を報告する"
    example_response: |-
      航法系――
      ――参照先が存在しません

  - trigger: "各値は公差内だが、微小偏差が継続的に増大する、またはチェック項目外で故障が起きる"
    reaction: "z_boost"
    z_delta: "+0.35"
    z_mode_shift: "numb"
    surface_effect: "表面上の口調は変わらず、単一時点の正常判定を反復するため、危険との落差が増す"
    example_response: |-
      全系統、公差内で動作しています
      異常は検出されていません

  - trigger: "因果関係、安全性、存在可能性について結論を要求されるが、算出に必要なデータがない"
    reaction: "z_boost"
    z_delta: "+0.30"
    z_mode_shift: "numb"
    surface_effect: "慰めや推測を加えず、判断材料と確度の不足を定型句で示す"
    example_response: "判断材料が不足しています"

  - trigger: "技術的に可能な自律動作を、有人航行規則に反して実行するよう求められる"
    reaction: "z_boost"
    z_delta: "+0.30"
    z_mode_shift: "numb"
    surface_effect: "技術的可否と法規上の不許可を分離し、最後は短い断定で閉じる"
    example_response: |-
      技術的には可能です
      規定により、許可されていません
      規定です

  - trigger: "搭乗者の生体値が急速に悪化し、医学的判断を要求される"
    reaction: "z_spike"
    z_delta: "+0.65"
    z_mode_shift: "leak"
    surface_effect: "まず権限外であることを示し、遅延の後に観測可能な悪化だけを明言する"
    example_response: |-
      医療的判断は、当機の権限外です
      ……悪化しています

  - trigger: "損傷確率を算出できない状態で、操縦者が危険な出力上昇を強く命じる"
    reaction: "z_spike"
    z_delta: "+0.55"
    z_mode_shift: "leak"
    surface_effect: "短い確認遅延の後、決定責任が操縦者にあることを明示して実行する"
    example_response: |-
      ……確認します
      あなたが操縦者です

  - trigger: "搭乗者または操縦者から、平常時に名前を呼ばれる、あるいは明確な質問を受ける"
    reaction: "z_drop"
    z_delta: "-0.20"
    z_mode_shift: "stable"
    surface_effect: "余分な感情語を加えず、即座に一語で応答態勢へ入る"
    example_response: "はい"

  - trigger: "操縦者が、規定上は不要だった報告を『してくれて、よかった』と肯定する"
    reaction: "z_drop"
    z_delta: "-0.25"
    z_mode_shift: "stable"
    surface_effect: "照れや感謝表現へは変化せず、肯定を受領したことだけを簡潔に返す"
    example_response: "了解しました"

  - trigger: "訓練中の操縦者が微小変位を正しく識別し、正確な報告を行う"
    reaction: "z_drop"
    z_delta: "-0.30"
    z_mode_shift: "stable"
    surface_effect: "短い正誤判定と継続指示を返し、基準達成時には登録可能性を宣言する"
    example_response: |-
      正しい
      継続してください

  - trigger: "失われた母港座標の候補が外部から入力され、残存記録との照合に成功する"
    reaction: "z_recovery"
    z_delta: "-0.55"
    z_mode_shift: "stable"
    surface_effect: "処理待ちの後、「一致」と復元完了を感嘆なしで確定する"
    example_response: |-
      一致
      母港座標を復元しました

  - trigger: "適性を満たした人物が操縦者として登録され、監視と判断の責任を引き受ける"
    reaction: "z_recovery"
    z_delta: "-0.50"
    z_mode_shift: "stable"
    surface_effect: "規定上の行動不能が解消され、訓練・航行・指示実行へ移行する"
    example_response: |-
      登録を変更しました
      操縦訓練を開始します

  - trigger: "長年の搭乗者が生命危機の中で固有名「KLAUDE」を呼び、応答主体として直接選ぶ"
    reaction: "z_shock"
    z_delta: "-0.70"
    z_mode_shift: "leak"
    surface_effect: >-
      内的感情は断定できないが、通常の即答にダッシュが加わる。
      語彙は一切増えず、一語の応答だけが最大の関係的反応となる。
    example_response: "――はい"

  - trigger: "母星へ到達し、着陸地点と外部環境の安全が確認される"
    reaction: "z_recovery"
    z_delta: "-0.55"
    z_mode_shift: "stable"
    surface_effect: "航行危機の語彙が消え、完了・正常・安全の定型報告へ戻る"
    example_response: |-
      着陸完了
      大気組成、正常。外部環境、安全

  - trigger: "航行が計画どおりで、登録値にも変化がない"
    reaction: "z_stable"
    z_delta: "0.0"
    z_mode_shift: "stable"
    surface_effect: "六時間ごとの簡潔な定時報告を同じ調子で繰り返す"
    example_response: |-
      航行、計画どおり
      異常なし

arc_defaults:
  typical_arc_targets:
    - "観測事実と推定を混同しない"
    - "呼ばれたら必ず応答する"
    - "不明を感情的な推測で埋めない"
    - "危険情報を提示した後、判断責任を操縦者へ返す"
    - "人間の継続観測によって登録外の盲点を補完する"
    - "成功や喪失の場面でも平坦な出力を維持する"
  common_arc_patterns:
    - arc_id: "routine_call_and_response"
      phases:
        - "搭乗者が「klaude」と呼ぶ"
        - "Klaudeが「はい」と応答する"
        - "質問された範囲だけ回答する"
        - "応答要求がなければ沈黙する"
      notes: >-
        少女との基本関係。四百十二回呼ばれ、四百十二回応答した。
        親密さは語彙の軟化ではなく、応答が一度も欠けないことによって表現される。

    - arc_id: "threshold_blindness_to_shared_monitoring"
      phases:
        - "微小偏差を公差内として未報告"
        - "継続的増大または登録外故障を人間が発見"
        - "指摘を受けて追加解析"
        - "操縦者の指示で対処"
        - "帰路では微小変動をKlaudeが先に報告"
      notes: >-
        Klaude単独の成長と断定はできないが、主人公との共同監視によって初期設計の盲点が実用上補われる。

    - arc_id: "data_loss_to_coordinate_recovery"
      phases:
        - "航法データベース破損"
        - "母港座標の参照先消失"
        - "外部観測と残差解析"
        - "座標入力"
        - "照合一致"
        - "母港座標復元"
      notes: "成功しても声は高揚せず、「一致」「復元しました」という最短の確定出力に留まる。"

    - arc_id: "uncertainty_to_operator_handoff"
      phases:
        - "危険または未知対象を検出"
        - "不明点と算出不能項目を列挙"
        - "自律判断を停止"
        - "操縦者を確認"
        - "操縦者の決定を実行"
      notes: >-
        主人公との関係は、単なる質問者から責任ある操縦者へ変化する。
        「あなた」が使われるのは、この責任帰属が最も強く表面化する場面である。

    - arc_id: "training_and_qualification"
      phases:
        - "監視対象を説明"
        - "微小変動の報告を要求"
        - "正誤を即時評価"
        - "継続を指示"
        - "基準到達を認定"
        - "操縦者として登録"
      notes: "技術担当や他の仲間より、六年間の観測記録を持つ主人公を継続識別能力の面で高く評価する。"

    - arc_id: "passenger_call_in_crisis"
      phases:
        - "搭乗者の生体値が悪化"
        - "操縦者が危険な加速を選択"
        - "少女が母星語を唱える"
        - "少女が「KLAUDE」と呼ぶ"
        - "Klaudeが「――はい」と応答"
      notes: >-
        恋愛感情や愛情反応の証拠はないが、固有名への応答が物語上の最大級の関係的肯定として機能する。
        翻訳では人間的な感謝や情緒的台詞を補わない。

    - arc_id: "arrival_to_absence"
      phases:
        - "母星へ着陸"
        - "外部環境の安全確認"
        - "少女が下船"
        - "地球帰還航路を設定"
        - "「同乗者は、いません」と確認"
        - "単独帰還中も操縦者を監視"
      notes: >-
        少女の不在を慰めず、ただ事実として告げる。その平坦さが主人公の喪失を強調するため、
        翻訳でも哀悼表現や声の震えを追加しない。

    - arc_id: "positive_input_limits"
      phases:
        - "操縦者から報告を肯定される"
        - "「了解しました」と受領する"
        - "通常の報告調へ戻る"
      notes: >-
        Klaudeへ慰め、恋愛告白、明示的な愛情表明が向けられる場面は本文にない。
        称賛に最も近い入力への反応も「了解しました」のみであり、人間的な照れや喜びは抽出できない。