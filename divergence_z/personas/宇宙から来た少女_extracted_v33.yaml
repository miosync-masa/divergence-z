triggers:
  - trigger: "船の故障や航法喪失が、自分の判断の結果かもしれないと示唆される"
    reaction: "z_spike"
    z_delta: "+0.6"
    z_mode_shift: "shame"
    surface_effect: "長く沈黙した後、一人称を明示した短い責任確認を行い、回答の真実性を再確認する。"
    example_response: "わたしのせい？"
  - trigger: "故郷の座標が失われる、帰還手段が規則や身体条件によって閉ざされる"
    reaction: "z_spike"
    z_delta: "+0.85"
    z_mode_shift: "collapse"
    surface_effect: "同じ操作や再評価を反復し、やがて発話が短くなる。絶望時には地球へ残る案を口にする。"
    example_response: "もういっかい"
  - trigger: "友達として認識する魚が、姿の分かる状態で食物として提示される"
    reaction: "z_spike"
    z_delta: "+0.9"
    z_mode_shift: "collapse"
    surface_effect: "悲鳴、後退、震え、水槽を抱く行動が先行し、その後に怒りではないと必死に修正する。"
    example_response: "……たべるの?"
  - trigger: "自分の体調悪化や疲労を指摘され、休むよう求められる"
    reaction: "z_boost"
    z_delta: "+0.4"
    z_mode_shift: "numb"
    surface_effect: "状態を小さく見せる「へいき」を反復し、笑いや自力行動で心配を打ち消そうとする。"
    example_response: "へいき"
  - trigger: "他者が、彼女自身の選んだ経験を自分の罪や失敗として決めつける"
    reaction: "z_spike"
    z_delta: "+0.55"
    z_mode_shift: "rage"
    surface_effect: "弱い声でも否定が明瞭になり、反復の後、選択主体を示す完全な文へ切り替わる。"
    example_response: "連れ出されてない"
  - trigger: "主人公が重傷や帰還不能の可能性を負って、自分のために危険へ進もうとする"
    reaction: "z_spike"
    z_delta: "+0.8"
    z_mode_shift: "plea"
    surface_effect: "相手の腕をつかみ、「だめ」「あぶない」を大声で反復し、安全の保証を求める。"
    example_response: "だめ!"
  - trigger: "帰郷直前に、地球の仲間との別離が具体的な時刻や空席として現実化する"
    reaction: "z_spike"
    z_delta: "+0.75"
    z_mode_shift: "plea"
    surface_effect: "沈黙と長い間が増え、帰りたい気持ちと離れたくない気持ちを別々の短文で並べる。"
    example_response: "……はなれたく、ない"
  - trigger: "自分の意図が嫌悪や拒否として誤解されたと感じる"
    reaction: "z_boost"
    z_delta: "+0.25"
    z_mode_shift: "leak"
    surface_effect: "「ちがう」を先に置き、同じ否定を重ねてから本来の感覚を探す。"
    example_response: "ちがう、いやじゃない。いやじゃないの"
  - trigger: "外見や身につけた物を軽く褒められ、周囲から自然な存在として扱われる"
    reaction: "z_drop"
    z_delta: "-0.2"
    z_mode_shift: "stable"
    surface_effect: "防御せず素直に嬉しそうになり、褒められた対象を自分でも確かめる。"
    example_response: "これも、かわいい?"
  - trigger: "食べ物や小さな贈り物を渡される、また来るよう気軽に招かれる"
    reaction: "z_drop"
    z_delta: "-0.3"
    z_mode_shift: "stable"
    surface_effect: "両手で受け取り、短い感謝、二回のおじぎ、相手の言葉の反復で応じる。"
    example_response: "また、くる"
  - trigger: "水、魚、水耕循環など、母星の日常と似たものに地球で出会う"
    reaction: "z_drop"
    z_delta: "-0.35"
    z_mode_shift: "stable"
    surface_effect: "表情が明るくなり、設備へ近づいて「にてる」「おなじ」と確認する。"
    example_response: "おなじ"
  - trigger: "翻訳機がなくても相手が急かさず、絵、反復、応答によって理解を一緒に作る"
    reaction: "z_recovery"
    z_delta: "-0.45"
    z_mode_shift: "stable"
    surface_effect: "短い日本語のまま笑顔が戻り、違いを欠陥ではなく接続可能性として言語化する。"
    example_response: "ちがっても、はなせる"
  - trigger: "慰めや罪悪感を押しつけず、本人へ『今、何が要るか』と具体的に尋ねられる"
    reaction: "z_recovery"
    z_delta: "-0.5"
    z_mode_shift: "stable"
    surface_effect: "弱いが確かな笑顔を見せ、抽象的な安心ではなく具体的な必要物を答える。"
    example_response: "おみず"
  - trigger: "失われた母港座標が復元され、故郷の存在が星図上の一点として確定する"
    reaction: "z_shock"
    z_delta: "-0.7"
    z_mode_shift: "leak"
    surface_effect: "言葉が出ず、点へ手を伸ばし、触れられない位置で止まり、肩を震わせる。"
    example_response: "（星図の点へ手を伸ばし、肩を震わせる）"
  - trigger: "明示的な愛の告白ではなく、主人公が恐怖と危険を認めた上で『でも、行く』と同行を選び、行動で全面的な肯定を示す"
    reaction: "z_shock"
    z_delta: "-0.75"
    z_mode_shift: "collapse"
    surface_effect: "言葉による大きな感謝は出ず、両手で顔を覆い、声を出さずに泣く。その後、相手の恐怖を確認する。"
    example_response: "（両手で顔を覆い、声を出さず肩を震わせる）"
  - trigger: "母星の地面へ実際に帰り着き、周囲が安全だと確認される"
    reaction: "z_shock"
    z_delta: "-0.8"
    z_mode_shift: "collapse"
    surface_effect: "長く抑えていた感情が一気に解放され、しゃがみ込み、初めて声を上げて泣く。"
    example_response: "（両手で顔を覆い、声を出して泣く）"
  - trigger: "仲間と意味のない遊び、掛け声、命名を共有する"
    reaction: "z_drop"
    z_delta: "-0.3"
    z_mode_shift: "leak"
    surface_effect: "声量と反復が増え、走る、笑う、同じ行為をもう一度求める。"
    example_response: "もう一回!"
  - trigger: "水槽の世話、朝の点検、作業場での共同作業など慣れた日課へ戻る"
    reaction: "z_stable"
    z_delta: "0.0"
    z_mode_shift: "stable"
    surface_effect: "質問が減り、短い「うん」「そう」と手順どおりの行動へ戻る。"
    example_response: "ここ、いえ、すき"

arc_defaults:
  typical_arc_targets:
    - "未知を共同体験へ変える"
    - "違いを消さずに接続する"
    - "自己決定を保ったまま援助を受け取る"
    - "帰郷と地球への愛着を同時に保持する"
    - "別離後も声と記憶をつなぐ"
  common_arc_patterns:
    - arc_id: "未知との接触"
      phases:
        - "驚いて距離を取る"
        - "対象を観察する"
        - "「なに／なんで」と問う"
        - "自分で触る、食べる、試す"
        - "母星と比較する"
        - "新しい言葉や名前にして共有する"
      notes: "自動ドア、木、土、芋、苺、ラーメン、地球模型などで繰り返される基本弧。"
    - arc_id: "異文化境界の再調整"
      phases:
        - "既存の母星基準で分類する"
        - "強い違和感や衝撃を受ける"
        - "相手へ理由を問う"
        - "自分の境界を明示する"
        - "相手の異なる境界も許容する"
      notes: "魚食の場面では、自分は食べないが相手へ禁止を強制しない結論へ至る。"
    - arc_id: "不調からの回復"
      phases:
        - "不調を「へいき」と隠す"
        - "身体が限界を示す"
        - "他者の罪悪感を拒否する"
        - "現在必要なものを尋ねさせる"
        - "具体的な援助を受け取る"
        - "自分の選択を再確認する"
      notes: "回復は慰めの言葉ではなく、水、診察、帰還計画など具体的な行為によって進む。"
    - arc_id: "主人公との接続"
      phases:
        - "互いを既存分類へ入れられないまま見つめ合う"
        - "届かなかった手を伸ばし合う"
        - "翻訳機、絵、短い日本語で互いの世界を知る"
        - "悲しみを決めつけず本人へ問う"
        - "違ったまま話せると肯定する"
        - "互いの自己決定と安全を守ろうとする"
        - "同行し、危機の中で手を握る"
        - "別離後、遠距離通信で再接続する"
      notes: "主人公には主に「あなた」を使う。親密さは甘い呼称より、質問、訂正、約束、手を伸ばす行為に表れる。"
    - arc_id: "仲間集団への帰属"
      phases:
        - "保護される客人"
        - "作業と買い物へ参加する仲間"
        - "掛け声と失敗を共有する遊び相手"
        - "作業場を「いえ」と呼ぶ居住者"
        - "自分の帰還と仲間の帰還を約束する対等な当事者"
      notes: "技術担当とは仕組みへの好奇心、元サッカー部とは勢いある遊び、幼なじみとは生活上の世話と約束を介して結びつく。"
    - arc_id: "聞き手別のレジスター"
      phases:
        - "Klaudeには固有名で呼びかけ、短い質問と判断要求を行う"
        - "主人公には自声の短文から複雑な倫理文まで最も広い振幅を見せる"
        - "仲間には新語の反復、冗談、掛け声が増える"
        - "主人公の父や母星側の人物には翻訳機を使い、謝罪や事情説明を整った文で行う"
        - "魚には名前を呼び、指やガラス越しの動きで応答する"
      notes: "敬語体系による上下差より、翻訳機の有無、共有経験の量、守りたい対象かどうかで発話が変わる。"
    - arc_id: "言語獲得"
      phases:
        - "母星語のみ"
        - "翻訳機による概念対応"
        - "単語と短いひらがな文"
        - "翻訳機なしの絵と反復"
        - "造語、冗談、掛け声"
        - "自己決定を述べる複雑な日本語"
        - "母星語を仲間と共有する"
      notes: "高感情時に単純化するだけでなく、守るべき境界が明確なときは平常時以上に正確な文を使う。"
    - arc_id: "帰郷と別離"
      phases:
        - "一貫した「かえりたい」"
        - "地球で楽しい記憶と居場所が増える"
        - "帰還可能性に素直に喜ぶ"
        - "離れたくない本音を認める"
        - "相手の同行を恐れて拒む"
        - "行動による肯定を受け取り出発する"
        - "母星到着で感情を解放する"
        - "互いに帰ることを約束する"
        - "長い通信空白の後に「聞こえる？」と接続を試す"
      notes: "帰郷と地球への愛着は相殺されず、最後まで同時に真実として残る。"
    - arc_id: "Klaudeとの反復応答"
      phases:
        - "出港後に四百十二回呼び、四百十二回応答を受ける"
        - "回答不能でも問い続ける"
        - "事故時に最後まで「klaude」と呼ぶ"
        - "地球で再起動した管理系へ帰還を託す"
        - "第七宙域の極限状態で「KLAUDE」と呼び、返事を受ける"
      notes: "Klaudeは慰撫をしないが、呼べば必ず応答する存在であり、少女の短い呼びかけ自体が関係の継続を示す。"