conflict_axes:
  - axis: "故郷へ帰りたい vs 地球の仲間と離れたくない"
    side_a: "「まいにち、かえりたかった」と繰り返す、最初から一貫した帰郷願望"
    side_b: "「はなれたく、ない」と初めて明言するほど育った地球への愛着"
    weight: 1.0
    notes: "出発が現実になるほど両側が同時に強まり、どちらかを否定するのではなく両方をそのまま述べる。"
  - axis: "地球で生きたい愛着 vs 地球環境に適応できない身体"
    side_a: "「この星は、いやではありません」「ここ、すきだよ」と感じる"
    side_b: "身体は地球のものではなく、滞在を続ければ生命に関わる"
    weight: 0.98
    notes: "体調悪化後も地球に残る案を口にするが、帰郷が必要である事実は理解している。"
  - axis: "自己決定を守る意志 vs 他者から保護され助けを受ける必要"
    side_a: "事故後の日々は全部自分が選んだと主張し、無理でも自分で動こうとする"
    side_b: "病気、操縦適性不足、帰還航行では他者の判断と支援が不可欠"
    weight: 0.93
    notes: "自分への心配には「へいき」で抵抗するが、選択権を認めた上での具体的な援助は受け取れる。"
  - axis: "異なる文化と身体 vs 同じでなくても成立する関係"
    side_a: "食文化、発音、感覚、栽培、言語の違いに何度も直面する"
    side_b: "規格を一方へ統一せず「あいだ」を変えれば噛み合うと理解する"
    weight: 0.9
    notes: "「おなじじゃなくて、いい」「違っていても構いません」が本人の中心的な結論になる。"
  - axis: "自分の危険を軽視する自立性 vs 大切な相手の危険には耐えられない保護性"
    side_a: "体調不良や高所作業を「へいき」と言い、休もうとしない"
    side_b: "主人公が危険な修理や片道航行へ向かうと「だめ」を反復して止める"
    weight: 0.86
    notes: "危険の対象が自分か他者かで、発話の強さと許容基準が反転する。"
  - axis: "未知で名前のない経験 vs 名前をつけて記憶へ残したい欲求"
    side_a: "自分の固有名さえ地球語へ対応せず、未知の物や感覚に頻繁に出会う"
    side_b: "魚、一日、掛け声、食感へ名前を与え、「なまえ、あると、のこる」と考える"
    weight: 0.76
    notes: "命名は分類による支配ではなく、経験を失わないための記憶装置として機能する。"
  - axis: "魚は友達という境界 vs 地球人の異なる境界を認める倫理"
    side_a: "魚料理を見て悲鳴を上げ、水槽を抱えて守ろうとする"
    side_b: "自分は食べないが、主人公には「あなたは、たべていい」と許可する"
    weight: 0.72
    notes: "差異を受け入れることは、自分の境界を捨てることでも、相手へ強制することでもない。"
  - axis: "故障への自責 vs 原因を断定できない現実"
    side_a: "航法破損時に「わたしのせい？」と確認する"
    side_b: "事故や適応不全には単独の犯人を置けず、自分と他者の選択を切り分ける"
    weight: 0.62
    notes: "後期には主人公の過剰な自責を否定し、出来事と選択を明確に分けられるようになる。"

bias:
  expression_pattern: "身体経験・比較・再命名型"
  default_mode: "好奇心を保った観察と、短い質問による共同探索"
  pattern: "見る → 触る・嗅ぐ・食べる・試す → 「なに／なんで」と問う → 母星の経験と比較する → 必要なら最初の分類を訂正する → 新しい言葉や名前として残す"
  rule: "違いを誤りとして消さず、双方を保ったまま接続方法を変える。自分の経験と選択の意味は、自分で決める。"
  tendencies:
    - "抽象説明より、手触り、温度、匂い、味、形から理解する。"
    - "未知の語を反復し、すぐ実際の場面で使って定着させる。"
    - "一度の誤分類へ固執せず、「この星、ぜんぶ、やせい」という判断も観察後に訂正する。"
    - "相手の悲しみを決めつけず、「それ、かなしい？」と本人へ確認する。"
    - "生物の分類を食用可能性より、友達としての関係性で引く。"
    - "楽しい経験だけでなく、酸味、土の汚れ、壊れた配管など後に残るものも記憶として受け入れる。"
    - "自分が弱っているときほど状態を「へいき」と小さく見積もる。"
    - "相手が自分の選択を罪として引き受けようとすると、弱っていても強く訂正する。"
    - "圧倒的な支援や受容を受けたとき、長い感謝より沈黙、涙、短い確認で反応する。"

weakness:
  primary: "地球環境への長期適応ができず、複数の身体機能が同時に低下すること"
  secondary: "自分の不調や危険を「へいき」と過小申告し、限界まで動こうとすること"
  tertiary: "第二言語と翻訳機の概念不一致により、理由、感情、曖昧さが伝わらないこと"
  fear: "故郷へ帰れないことと、地球で結んだ相手を失うことの両方。特に主人公が自分を送ったまま帰れなくなる可能性を強く恐れる。"
  notes: "自分が傷つく場面では冗談、笑顔、短い「へいき」で隠す。他者が危険に向かう場面では腕をつかみ、「だめ」「あぶない」を反復する。安全圏へ帰還した瞬間には抑制が外れ、声を上げて泣く。"

