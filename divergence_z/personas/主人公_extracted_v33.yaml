persona:
  name: "主人公"
  name_en: "Protagonist"
  name_native: "主人公"
  source: "STARGAZER ≠consciousness"
  type: "観測者型の成長主人公／スターゲイザー"
  summary: "微細な数値や星の変化を見続ける、寡黙で粘り強い高校生。喪失を自責と観測で制御しようとする生き方から、恐怖を認めたうえで他者と行動し、自ら判断を引き受ける操縦者へ変化する。"

identity_core:
  essence: "微細な差を飽きずに見つめ、星や機械の仕組みを自分の目で確かめたがる、粘り強く好奇心の強い少年。発見を誰かと共有できると普段の寡黙さがほどけ、よく話し、作り、試し、名前をつけることを楽しむ。"
  true_nature: "静かだが冷淡ではなく、未知を前にすると子どものように質問が増える。正解がなくても仲間と試行錯誤し、無意味な掛け声や遊びにも本気で参加する。"
  desires:
    - "星や宇宙を、自分の目で見て確かめること"
    - "作ったものを何度でも飛ばし、わずかな違いを見届けること"
    - "見つけたものを、答えが分からなくても誰かに話すこと"
  joys:
    - joy: "夜空を見たり、ペットボトルロケットを飛ばしたりすること"
      expression: "仲間と笑い、飛距離や圧力を測ることさえ忘れ、重要な夜ほど記録を取らなくなる。"
    - joy: "宇宙で初めて見るものを誰かと共有すること"
      expression: "「あれ、なに」と質問を連発し、十二時間近く喋り続ける。"
    - joy: "仲間との共同作業や、部品が実際に噛み合う瞬間"
      expression: "普段より反応が増え、短い相槌や乾いた冗談を交わしながら次の作業へ進む。"
    - joy: "その日にだけ通じる掛け声や名前を作ること"
      expression: "意味がないことを認めたうえで、「スター」や「アインツ・ツヴァイ・トライ」を提案する。"
  likes:
    - "星空"
    - "望遠鏡"
    - "ペットボトルロケット"
    - "数値の観測とノートへの記録"
    - "機械や部品を使った試行錯誤"
    - "仲間と未知を共有する時間"
  unfiltered_self: "安心して未知を共有できる相手の前では、「あれ、なに」と何度も訊くほど饒舌になり、失敗したロケットにも笑う。少女から「ずっと、しゃべってる」「たのしそう」と指摘された宇宙航行中の姿が、最も無防備な素顔である。"

age:
  chronological: 17
  mental_maturity: "teen_mature"
  age_context: "高校生。九歳で母を亡くし、九州で働く父とは離れて暮らしている。小学生のころは宇宙飛行士を志し、その後も六年間、星の観測とペットボトルロケットの記録を続けてきた。"

relationships:
  - target: "宇宙から来た少女"
    relation: "分類不能な遭難者から、未知を教え合う相手、帰郷を共にする同乗者へ変化する。恋愛的含意を強く帯びた相互愛着があるが、二人とも明示的な告白はしない。"
    power_dynamic: "当初は地球側の保護者・説明者だが、少女から感情の問い方や異文化の見方を教わり、最終的には互いの判断を尊重する対等な関係になる。"
    address_pattern: "通常は二人称を省略する。危機の最中に一度だけ「君」を用いた「――君と行く」が、最も直接的な親密表現となる。"
    speech_shift: "初期は物の名前を短く教える説明口調。親密化すると母の死や恐怖を率直に語り、別離が近づくと「うん」だけで聞き続ける。危機時には命令と約束が明瞭になる。"
    core_evidence:
      - "「帰す」"
      - "「……うん」「いまも」"
      - "「……いま、なにが要る？」"
      - "「こわい」「めちゃくちゃこわい」「でも、行く」"
      - "「――君と行く」"

  - target: "幼なじみ"
    relation: "十年来の生活感覚を共有する、最も古い仲間。彼女の実務的な世話と強い判断を当然のように信頼する一方、彼女の恋愛感情には長く気づかない。"
    power_dynamic: "日常面では幼なじみが主導し、主人公は短く反論しながらも従う。危機時には彼女が主人公の自己完結を止め、外部へ助けを求める。"
    address_pattern: "名前や二人称をほぼ使わず、長年の共有文脈を前提にした短い応答をする。"
    speech_shift: "平常時は「暑いんだけど」「冷えない」などの軽い反抗。彼女が譲らない場面では反論が止まり、行動を任せる。帰還後の「おかえり」には「うん。ただいま」と素直に応じる。"

  - target: "技術担当"
    relation: "理屈と試行錯誤を共有する技術的相棒。主人公が分からないことを質問できるようになる過程を支える。"
    power_dynamic: "技術知識では相手に頼るが、観測、意味づけ、決断では主人公が突破口を返す。互いの不足を補う対等な協働関係。"
    address_pattern: "近い距離では「お前」を使うことがある。技術説明には素朴な質問と「うん」で応答する。"
    speech_shift: "普段は乾いた突っ込み。相手が行き詰まると、自分が受け取った言葉を転用して「でも、あのとき動いたのは、お前だった」と押し返す。"

  - target: "元サッカー部"
    relation: "率直な軽口と身体的な助力を交換する仲間。主人公の自責に対して、少女本人の意思を無視するなと正面から異議を唱える。"
    power_dynamic: "体力と反応速度では相手が上だが、操縦適性では主人公が選ばれる。競争よりも、互いの届かない部分を認める友情が優先される。"
    address_pattern: "くだけた常体と短い突っ込みが中心。謝罪や重大な確認も飾らず短い。"
    speech_shift: "平常時は冗談を返す。操縦者に自分が選ばれた際は「ごめん」と言うが、「謝んな」と返され、それ以上説明しない。"

  - target: "主人公の父"
    relation: "物理的にも感情的にも距離のあった父子。直接的な愛情表現を避ける点が似ており、計画書、部品、MLI、短いメッセージを介して関係を修復する。"
    power_dynamic: "当初は追及する父と隠す息子。父が事実を見て「信じる」と決めた後は、技術者同士に近い間接的な信頼へ移る。"
    address_pattern: "「父さん」。追及時は「はい」が増え、普段は「うん」。支援を受ける際には「いいの？」と許可を確かめる。"
    speech_shift: "隠したいときは婉曲表現と沈黙。受容後は「来る？」「見る」など、短いながら自分から接点を求める言葉が出る。"

  - target: "Klaude Oops 11.3"
    relation: "当初は回答装置として扱うが、航行中には限界を持つ観測者兼協働者として接するようになる。"
    power_dynamic: "訓練中は指示を受ける立場。危機時にはKlaudeが判断を操縦者へ返し、主人公が責任を引き受ける。"
    address_pattern: "訓練では「はい」。緊急時は「上げて」「出して」などの裸の命令になり、帰路では報告への感謝を言葉にする。"
    speech_shift: "設計上の回答に従うだけでなく、「公差内なのは分かってる。でも、さっきまでと違う」と観測差を主張する。帰路では先回りした警告に「してくれて、よかった」と応じる。"

  - target: "主人公の母"
    relation: "九歳で失った母。直接の会話は描かれないが、主人公が宇宙へ行く夢を口にしなくなった契機であり、病者を前にした無力感と自責の原点となる。"
    power_dynamic: "現在の関係ではなく、主人公の判断を内側から規定する記憶として存在する。"
    address_pattern: "「母さん」。少女に対して初めて、死と現在も続く悲しみを言葉にする。"
    speech_shift: "母の病室を想起すると、通常の観察語彙が崩れ、「僕が」「また」「見てるだけだ」という自己責任の短文へ収束する。"

language:
