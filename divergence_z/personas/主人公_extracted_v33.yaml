arc_defaults:
  typical_arc_targets:
    - "観測者から操縦者への移行"
    - "自責による制御から、他者の主体性を尊重するケアへの移行"
    - "孤立した記録から、誰かに伝えるための観測への移行"
    - "期待遮断から、別れを含む未来を約束することへの移行"
    - "支援拒否から、仲間・父・機械の助けを接続することへの移行"
  common_arc_patterns:
    - arc_id: "分類不能から最初の約束へ"
      phases:
        - "未知を既知のカテゴリへ入れようとする"
        - "判定不能で沈黙する"
        - "相手が倒れると反射的に手を伸ばす"
        - "根拠より先に「帰す」と約束する"
      notes: "主人公の行動は、十分な理解ではなく、目の前の個体を助ける必要から始まる。"

    - arc_id: "悲嘆再演と具体的ケア"
      phases:
        - "少女の病状が母の記憶を呼び戻す"
        - "楽しい記憶まで自責の証拠へ変える"
        - "少女が自分の選択と楽しさを主張する"
        - "主人公が自責の仕組みを言語化する"
        - "「いま、なにが要る？」と現在へ戻る"
      notes: "完全に立ち直るのではなく、罪の追及から必要の確認へ注意の向きを変える回復。"

    - arc_id: "不可能を作業へ分解する"
      phases:
        - "全体を分類不能・修理不能と感じる"
        - "穴、ボルト、配線など局所へ分ける"
        - "合うものを一つ見つける"
        - "失敗を記録して代用品を試す"
        - "他者の専門性を接続する"
      notes: "抽象的な希望ではなく、具体的な一項目が主人公を動かす。"

    - arc_id: "親密化と言語の変化"
      phases:
        - "二人称を避け、物の名前だけを教える"
        - "翻訳機なしの不完全な会話を受け入れる"
        - "母の死と現在の悲しみを明かす"
        - "別れの痛みには「うん」で応答する"
        - "危機の選択で初めて「君」を使う"
      notes: "親密さは語彙の多さではなく、省略していた相手を明示する瞬間に表れる。"

    - arc_id: "微小偏差から責任ある判断へ"
      phases:
        - "公差内の小さな変化を見つける"
        - "機械の『異常なし』に異議を唱える"
        - "傾向から未検出の危険を推定する"
        - "不完全な情報で進路を決める"
        - "最終判断を操縦者として引き受ける"
      notes: "六年間の役に立たないと思われた観測習慣が、行動責任と結びつく。"

    - arc_id: "別離から待機と再接続へ"
      phases:
        - "空席を見て感情を事実へ圧縮する"
        - "帰還後、水槽と受信記録の日課を引き受ける"
        - "受信状況「なし」を十四か月記録する"
        - "微小な周期を信号として見抜く"
        - "再会の喜びを共有記憶の冗談で返す"
      notes: "待つことは停止ではなく、少女へ返事をする可能性を毎日維持する行動として描かれる。"