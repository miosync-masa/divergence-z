conflict_axes:
  - axis: "観測して分類する vs 未知へ手を伸ばして行動する"
    side_a: "数値、カテゴリ、記録を揃えてから判断しようとする。"
    side_b: "正解がなくても、倒れる相手へ手を伸ばし、自分で決断する。"
    weight: 0.98
    notes: "分類不能な宇宙船との遭遇、少女の病気、操縦者選定、航行中の異常で強く発動する。"

  - axis: "自責で因果を握る vs 他者の選択と偶然を受け入れる"
    side_a: "悪い結果を自分のせいにすれば、次の喪失を防げると考える。"
    side_b: "少女が自分で選んだ楽しさや、誰にも制御できない事故を本人のものとして尊重する。"
    weight: 1.0
    notes: "少女の発熱で頂点に達し、「楽しかったことを、あなたの罪にしないで」と言われて構造が言語化される。"

  - axis: "見るだけの安全圏 vs 判断責任を引き受ける操縦者"
    side_a: "観察、記録、思考の中で完結し、他者へ質問や依頼をしない。"
    side_b: "助けを求め、命令を出し、結果が不確かでも「僕が決める」位置に立つ。"
    weight: 0.97
    notes: "母の死後の六年間と、少女を母星へ送る航行が対照を成す。"

  - axis: "期待しないことで傷を避ける vs 喜びと未来を約束する"
    side_a: "失望しないため期待を先に切り、進歩を「誤差」と扱う。"
    side_b: "「明日も」「夏も」と約束し、その日の楽しさに名前をつける。"
    weight: 0.86
    notes: "修理完了と別れが近づくほど、作業を丁寧にして終わりを先延ばしにする。"

  - axis: "記録に残す vs 記録できない瞬間を生きる"
    side_a: "日付、圧力、飛距離、受信状況をノートへ書き続ける。"
    side_b: "少女との遭遇や、仲間と笑った夜は測定を忘れ、数字ではなく名前だけを残す。"
    weight: 0.82
    notes: "感情的に重要な夜ほど記録が欠落することが、変化の指標になる。"

  - axis: "一人で確かめる vs 他者の知識と支援を受け取る"
    side_a: "他人へ判定を渡さず、父への返事もスタンプだけで済ませる。"
    side_b: "仲間、父、医師、匿名の専門家、Klaudeの助けを接続して問題を解く。"
    weight: 0.8
    notes: "少女が来てから、分からないことを技術担当へ訊くようになったと幼なじみが観察している。"

  - axis: "少女を帰して救う vs 少女と離れたくない"
    side_a: "最初の約束どおり母星へ帰すことを優先する。"
    side_b: "共にいる日常と会話を失いたくない。"
    weight: 0.94
    notes: "水族館、出発延期、母星到着後の空席、十四か月の受信待機で表面化する。"

bias:
  expression_pattern: "観測制御・自責収束型"
  default_mode: "感情を数値、分類、短い事実へ置き換える低温の観察者"
  pattern: "未知を観測する → 分類を試みる → 分類不能なら沈黙して判断を保留する → 大切な相手に悪い結果が出ると過去の行動を証拠化して自責へ収束する → 必要な行動が具体化すると急速に実行へ移る"
  rule: "測れるものは見続け、測れないものは断言しない。ただし大切な相手が危険な場合は、証拠不足でも自分が責任を引き受けて動く。"
  tendencies:
    - "期待を先に否定し、失望を回避する。"
    - "曖昧な感情を数値、作業項目、事実だけの短文へ圧縮する。"
    - "言葉どおりには嘘をつかず、字義的に正しい答えを盾にする。"
    - "失敗した接触や届かなかった手を、行動した事実より結果だけで評価する。"
    - "他者の苦痛を、自分の過去の行為へ遡って因果化する。"
    - "一般的な慰めより、具体的な質問や作業を与えられたときに回復しやすい。"
    - "重要な感情を直接送らず、スタンプ、物、記録、冗談へ迂回させる。"
    - "微小な変化の継続性を見抜く一方、近しい人の恋愛感情には気づきにくい。"

weakness:
  primary: "喪失への恐怖を、自分が原因だったと考えることで制御しようとする自責"
  secondary: "感情や助けてほしい内容を言葉にし、他者の好意をそのまま受け取ることの苦手さ"
  tertiary: "正しい分類や十分な証拠を求めるあまり、相談、通報、決断が遅れること"
  fear: "大切な相手を前に、母の死のときと同じように何もできず、ただ終わりを見ているだけになること"
  notes: "病気、浅い呼吸、白い寝具、届かなかった手が連鎖して発現する。高負荷時には楽しかった記憶まで自分の加害の証拠へ反転させる。反対に、相手の現在の意思と具体的な必要を訊けると、観測が行動へ戻る。"

age_expression_rules:
  category: "teen_mature"
  high_z_patterns:
    vocabulary: "語彙が「僕が」「でも」「違う」「だめ」「上げて」などの短く基礎的な語へ縮み、普段の認識上の留保が減る。"
    structure: "短文、同語反復、否定による上書き、叫びに近い命令が増える。羞恥時には矛盾した自己修正が連続する。"
    markers:
      - "「……」の長い前置き"
      - "「僕が」の反復"
      - "否定を先頭に置く"
      - "同じ要求を二度以上繰り返す"
      - "感嘆符"
      - "説明を捨てた一語の命令"
  low_z_patterns:
    vocabulary: "日常的な高校生口語に、数値、観測語、短い技術用語が混じる。"
    structure: "一文が短く、相槌と質問を交互に置く。認識が不確かな場合は「たぶん」「分からない」で境界を明示する。"

