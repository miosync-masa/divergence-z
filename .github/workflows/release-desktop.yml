# Build the desktop app for macOS (Apple silicon + Intel) and Windows, unsigned, and publish
# the installers to GitHub Releases.
#   - push a tag like v0.2.0  → build all platforms + create a Release
#   - Actions tab "Run workflow" → build only (installers are attached to the run as artifacts)
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest          # Apple silicon
            builder: --mac --arm64
            files: app/release/*.dmg
          - name: macos-x64
            runner: macos-15-intel        # Intel
            builder: --mac --x64
            files: app/release/*.dmg
          - name: windows-x64
            runner: windows-latest
            builder: --win --x64
            files: app/release/*.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sidecar (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,pdf]" pyinstaller
          PYTHON=python packaging/build_sidecar.sh

      - name: Smoke test sidecar
        run: |
          ./dist-sidecar/dz-server/dz-server --no-parent-watch > ready.json &
          for i in $(seq 1 90); do [ -s ready.json ] && break; sleep 1; done
          cat ready.json
          PORT=$(python -c "import json;print(json.load(open('ready.json'))['port'])")
          curl -sf "http://127.0.0.1:${PORT}/health"
          kill %1 || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build app
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi
          npm run build
          npx electron-builder ${{ matrix.builder }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: divergence-z-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 本文 = docs/releases/<tag>.md（あれば）＋ ダウンロードと初回起動の案内
      - name: Compose release notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          {
            if [[ -f "$NOTES" ]]; then cat "$NOTES"; else echo "## Divergence-Z ${GITHUB_REF_NAME}"; fi
            echo
            cat <<'MD'
          ---

          ## Downloads / ダウンロード

          | | File |
          |---|---|
          | macOS (Apple silicon) | `Divergence-Z-*-arm64.dmg` |
          | macOS (Intel) | `Divergence-Z-*-x64.dmg` |
          | Windows | `Divergence-Z-Setup-*-x64.exe` |

          BYOK: after launch, enter your OpenAI / Anthropic API key under «キー & モデル».
          起動後「キー & モデル」で OpenAI / Anthropic の API キーを入れてください。

          **These builds are not signed.** Mac: right-click the app → Open (or allow it in System Settings →
          Privacy & Security). Windows: on the SmartScreen prompt choose "More info" → "Run anyway".
          **署名なしのビルドです。** Mac は Finder でアプリを右クリック →「開く」、Windows は「詳細情報」→「実行」で起動してください。
          MD
          } > release_body.md
          sed -i 's/^          //' release_body.md
          cat release_body.md

      # 下書きで作る: 本文を確認して「Publish」した時点で Zenodo が DOI を発行する
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body_path: release_body.md
