# Build the macOS desktop app (unsigned, ad-hoc signed) and publish it to GitHub Releases.
#   - push a tag like v0.2.0  → build + create a Release with the .dmg
#   - Actions tab "Run workflow" → build only (the .dmg is attached to the run as an artifact)
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest          # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sidecar (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,pdf]" pyinstaller
          PYTHON=python packaging/build_sidecar.sh

      - name: Smoke test sidecar
        run: |
          ./dist-sidecar/dz-server/dz-server --no-parent-watch > ready.json &
          for i in $(seq 1 60); do [ -s ready.json ] && break; sleep 1; done
          cat ready.json
          PORT=$(python -c "import json;print(json.load(open('ready.json'))['port'])")
          curl -sf "http://127.0.0.1:${PORT}/health"
          kill %1 || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build app
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: divergence-z-macos-arm64
          path: app/release/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/*.dmg
          generate_release_notes: true
          body: |
            ## Divergence-Z ${{ github.ref_name }} (macOS, Apple silicon)

            BYOK のデスクトップアプリです。起動後「キー & モデル」で OpenAI / Anthropic の API キーを入れてください。

            **このビルドは Apple の署名・公証をしていません。** 初回は次のどちらかで開いてください。
            - Finder でアプリを右クリック →「開く」
            - 開けない場合: システム設定 → プライバシーとセキュリティ →「このまま開く」

            This build is not signed or notarized by Apple. On first launch, right-click the app → Open,
            or allow it in System Settings → Privacy & Security.
